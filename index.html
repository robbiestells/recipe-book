<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mise en Place</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first app shell — sticky header, one scrolling view, bottom tab bar; recipe cards in an auto-fill grid that collapses to one column. */
:root{
  --bg:#F2F4EE; --surface:#FFFFFF; --sunk:#E8ECE3; --ink:#1B2620; --muted:#5B685F; --line:#D8DFD3;
  --basil:#2C6A48; --basil-ink:#FFFFFF; --saffron:#C98B12; --saffron-soft:#F6EAC9; --tomato:#B8422B;
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px; --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111713; --surface:#19211C; --sunk:#222C25; --ink:#E6ECE5; --muted:#99A69D; --line:#2D3931;
  --basil:#7CC39A; --basil-ink:#0E1912; --saffron:#E7B64A; --saffron-soft:#3A3120; --tomato:#E7836B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#19211C; --sunk:#222C25; --ink:#E6ECE5; --muted:#99A69D; --line:#2D3931;
  --basil:#7CC39A; --basil-ink:#0E1912; --saffron:#E7B64A; --saffron-soft:#3A3120; --tomato:#E7836B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--basil);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:21px;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
main{padding-block:16px calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px))}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--basil);color:var(--basil-ink);border-color:var(--basil)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--tomato)}
.btn.armed{background:var(--tomato);color:var(--surface);border-color:var(--tomato)}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{border:none;background:transparent;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:20px;line-height:1}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
textarea.field{resize:vertical;min-height:90px;line-height:1.45}
.search{display:flex;gap:8px;margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.cardmain{border:none;background:none;width:100%;border-radius:inherit;text-align:left;padding:14px 48px 14px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.star{position:absolute;top:6px;right:6px;border:none;background:transparent;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.star:hover{background:var(--sunk)}
.star[aria-pressed="true"]{color:var(--saffron)}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--basil);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.banner p{margin:0;font-size:14px;max-width:48ch}
.card:hover{border-color:var(--muted)}
.card h3{font-size:17px;line-height:1.25}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:12px;background:var(--sunk);border-radius:6px;padding:1px 7px;color:var(--muted)}
.tag.ex{background:var(--saffron-soft);color:var(--saffron);font-weight:600}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:0 0 10px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;display:grid;gap:12px;justify-items:start}
.empty h2{font-size:22px}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* Planner */
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.weekbar h2{font-size:20px}
.summary{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.summary b{font-family:var(--f-display);font-size:18px}
.days{display:grid;gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start}
.day.today{border-color:var(--basil)}
.dlabel{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.1}
.dlabel span{display:block;font-family:var(--f-mono);font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.today .dlabel span{color:var(--basil)}
.meals{display:grid;gap:6px;min-width:0}
.meal{display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:8px;padding:4px 4px 4px 10px;min-width:0}
.meal button.t{flex:1;min-width:0;border:none;background:none;text-align:left;padding:4px 0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meal .iconbtn{width:28px;height:28px;font-size:16px}
.addmeal{justify-self:start;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted)}
.addmeal:hover{border-color:var(--basil);color:var(--basil)}
/* Shopping */
.shophead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.shophead h2{font-size:20px}
.sec{margin-bottom:14px}
.sec h3{font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 12px;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.item input[type=checkbox]{width:20px;height:20px;margin:2px 0 0;accent-color:var(--basil)}
.item .name{font-weight:500;min-width:0;overflow-wrap:anywhere}
.item .from{font-size:12px;color:var(--muted)}
.item .qty{font-family:var(--f-mono);font-size:13px;color:var(--ink);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.item.done .name,.item.done .qty{text-decoration:line-through;color:var(--muted)}
.item label{display:contents;cursor:pointer}
.extraform{display:flex;gap:8px;margin-bottom:8px}
/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabh)}
.tab{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:12px;font-weight:600}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--basil)}
.badge{font-family:var(--f-mono);font-size:10px;background:var(--saffron);color:var(--surface);border-radius:999px;padding:0 5px;margin-left:3px}
/* Sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(10,16,12,.45)}
.panel{position:relative;background:var(--bg);width:100%;max-width:640px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow:auto;border-radius:18px 18px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:18px;max-height:90%}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.phead h2{font-size:23px;line-height:1.2}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--sunk);border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{border:none;background:transparent;border-radius:8px;padding:7px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--muted);margin:0}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;background:var(--surface);display:grid;gap:8px;justify-items:center}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.status{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--basil);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--tomato);font-size:14px;margin:0}
.ing{list-style:none;padding:0;margin:0;display:grid}
.ing li{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.ing .q{font-family:var(--f-mono);font-size:13px;color:var(--basil);text-align:right;font-variant-numeric:tabular-nums}
.ing .n{color:var(--muted)}
.steps{padding:0;margin:0;list-style:none;counter-reset:s;display:grid;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;max-width:65ch}
.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:700;font-size:15px;width:26px;height:26px;border-radius:50%;background:var(--sunk);display:grid;place-items:center}
.dsec{margin-top:20px}
.dsec h3{font-size:16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.scaler{display:inline-flex;align-items:center;gap:2px;font-family:var(--f-mono);font-size:12px;font-weight:400;color:var(--muted)}
.scaler .iconbtn{width:28px;height:28px;font-size:16px}
.pick{display:grid;gap:6px;margin-top:10px}
.pick button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.pick button:hover{border-color:var(--basil)}
.pick small{font-family:var(--f-mono);color:var(--muted);font-size:12px}
/* Cooking mode */
.cook{position:fixed;inset:0;z-index:25;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.cook .in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 0px) calc(120px + env(safe-area-inset-bottom,0px))}
.cookbar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-bottom:16px}
.cookbar .top1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cookbar h2{flex:1 1 auto;font-size:20px;line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cookmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--basil);border-radius:inherit;transition:width .25s ease}
.cook details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px}
.cook summary{cursor:pointer;padding:12px 14px;font-family:var(--f-display);font-weight:700;font-size:17px;display:flex;justify-content:space-between;align-items:center;list-style:none}
.cook summary::-webkit-details-marker{display:none}
.cook summary small{font-family:var(--f-mono);font-weight:400;font-size:12px;color:var(--muted)}
.cing{display:grid;grid-template-columns:auto 84px 1fr;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;font-size:17px}
.cing input{width:22px;height:22px;margin:0;accent-color:var(--basil)}
.cing .q{font-family:var(--f-mono);font-size:14px;color:var(--basil);text-align:right;font-variant-numeric:tabular-nums}
.cing.done{color:var(--muted)}.cing.done .q{color:var(--muted)}
.csteps{display:grid;gap:10px}
.cstep{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 14px 14px 12px}
.cstep.current{border-color:var(--basil);box-shadow:0 0 0 3px color-mix(in srgb,var(--basil) 18%,transparent)}
.cstep.done{background:transparent}
.cstep.done .ctext{color:var(--muted)}
.ccheck{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--muted)}
.cstep.current .ccheck{border-color:var(--basil);color:var(--basil)}
.cstep.done .ccheck{background:var(--basil);border-color:var(--basil);color:var(--basil-ink)}
.ctext{font-size:19px;line-height:1.55;max-width:60ch;cursor:pointer}
.ctimers{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tbtn{border:1px solid var(--saffron);background:var(--saffron-soft);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.finish{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:10px;justify-items:start}
.finish h3{font-size:20px}
.timerbar{position:fixed;left:0;right:0;z-index:26;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));padding:8px max(12px,env(safe-area-inset-left,0px)) 8px max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;pointer-events:none}
body.cooking .timerbar{bottom:env(safe-area-inset-bottom,0px)}
.timer{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 6px 6px 14px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.timer b{font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.timer button{border:none;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);width:28px;height:28px;border-radius:50%;font-size:16px;line-height:1}
.timer.ring{background:var(--tomato);animation:ring 1s ease-in-out infinite}
@keyframes ring{50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.timer.ring{animation:none}.progress span{transition:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500;max-width:calc(100% - 32px)}
.local{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}
a{color:var(--basil)}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand">Mise en Place <small id="modeTag"></small></div>
  <div class="row"><button class="iconbtn" data-act="settings" id="setBtn" aria-label="Settings"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button><button class="btn primary" data-act="add" id="addBtn">+ Add recipe</button></div>
</div></header>

<main class="wrap">
  <section id="v-recipes">
    <div class="banner" id="signBanner" hidden><p><b>Keep your recipes safe.</b> Sign in to save recipes, favorites and shopping lists to your account and use them on any device.</p><button class="btn primary" data-act="settings">Sign in</button></div>
    <div class="search"><input id="q" class="field" type="search" placeholder="Search recipes, tags or ingredients" autocomplete="off"></div>
    <div class="chips" id="cats"></div>
    <div id="recipeList"></div>
  </section>

  <section id="v-plan" hidden>
    <div class="weekbar">
      <button class="iconbtn" data-act="week" data-d="-7" aria-label="Previous week">‹</button>
      <div style="text-align:center"><h2 id="weekTitle"></h2><button class="btn ghost" data-act="week" data-d="0" id="thisWeek" style="padding:2px 8px;font-size:12px">Back to this week</button></div>
      <button class="iconbtn" data-act="week" data-d="7" aria-label="Next week">›</button>
    </div>
    <div class="summary" id="planSummary"></div>
    <div class="days" id="days"></div>
  </section>

  <section id="v-shop" hidden>
    <div class="shophead">
      <div><h2>Shopping list</h2><div class="meta" id="shopWeek"></div></div>
      <div class="row">
        <button class="btn" data-act="copy">Copy list</button>
        <button class="btn ghost" data-act="clearChecked">Clear checked</button>
      </div>
    </div>
    <form class="extraform" id="extraForm"><input id="extraIn" class="field" placeholder="Add something else (paper towels, coffee…)" autocomplete="off"><button class="btn" type="submit">Add</button></form>
    <div id="shopList"></div>
  </section>
  <p class="local" id="localNote" hidden>Recipes, plans and lists are saved in this browser on this device.</p>
</main>

  <button class="tab" role="tab" data-tab="recipes" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/></svg>Recipes</button>

<script>
const SECTIONS=["Produce","Meat & Seafood","Dairy & Eggs","Bakery","Pantry","Spices","Frozen","Other"];
const CATS=["Breakfast","Lunch","Dinner","Side","Soup & Stew","Salad","Snack","Dessert","Drink","Baking","Sauce"];
const UNITS={tsp:"tsp",teaspoon:"tsp",teaspoons:"tsp",t:"tsp",tbsp:"tbsp",tbs:"tbsp",tablespoon:"tbsp",tablespoons:"tbsp",T:"tbsp",cup:"cup",cups:"cup",c:"cup",oz:"oz",ounce:"oz",ounces:"oz",lb:"lb",lbs:"lb",pound:"lb",pounds:"lb",g:"g",gram:"g",grams:"g",kg:"kg",ml:"ml",l:"l",liter:"l",liters:"l",clove:"clove",cloves:"clove",can:"can",cans:"can",pinch:"pinch",dash:"dash",bunch:"bunch",bunches:"bunch",slice:"slice",slices:"slice",package:"package",packages:"package",pkg:"package",stick:"stick",sticks:"stick",sprig:"sprig",sprigs:"sprig",head:"head",heads:"head",quart:"quart",quarts:"quart",pint:"pint",pints:"pint",jar:"jar",jars:"jar",handful:"handful"};
const S={recipes:{},plan:{days:{}},shop:{weeks:{}},view:"recipes",q:"",cat:"All",week:sow(new Date())};
let mode="local", col=null; const queues={};

/* ---------- utils ---------- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function clone(o){return JSON.parse(JSON.stringify(o))}
function uid(){return "r_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function sow(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function dkey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function weekLabel(ws){const we=addDays(ws,6);return MON[ws.getMonth()]+" "+ws.getDate()+" – "+(we.getMonth()!==ws.getMonth()?MON[we.getMonth()]+" ":"")+we.getDate()}
const FR=[[0,""],[.125,"⅛"],[.25,"¼"],[1/3,"⅓"],[.375,"⅜"],[.5,"½"],[.625,"⅝"],[2/3,"⅔"],[.75,"¾"],[.875,"⅞"]];
function fmtQty(q){if(q==null||isNaN(q))return"";let w=Math.floor(q+1e-9),f=q-w;for(const[v,s]of FR){if(Math.abs(f-v)<.03)return(w?w:"")+(s?(w?" ":"")+s:"")||"0"}if(Math.abs(f-1)<.03)return String(w+1);return String(Math.round(q*100)/100)}
const UF={"¼":.25,"½":.5,"¾":.75,"⅓":1/3,"⅔":2/3,"⅛":.125,"⅜":.375,"⅝":.625,"⅞":.875};
function parseLine(line){
  let s=line.trim().replace(/^[-•*]\s*/,"");if(!s)return null;
  s=s.replace(/(\d)([¼½¾⅓⅔⅛⅜⅝⅞])/g,"$1 $2");
  let qty=null;const m=s.match(/^((\d+\s+\d+\/\d+)|(\d+\/\d+)|(\d*\.?\d+)|([¼½¾⅓⅔⅛⅜⅝⅞]))(\s+[¼½¾⅓⅔⅛⅜⅝⅞])?(\s*(-|–|to)\s*[\d./]+)?\s*/);
  if(m){const t=m[1];if(m[2]){const[a,b]=t.trim().split(/\s+/);const[n,d]=b.split("/");qty=+a+n/d}else if(m[3]){const[n,d]=t.split("/");qty=n/d}else if(m[5])qty=UF[t];else qty=parseFloat(t);if(m[6])qty+=UF[m[6].trim()];s=s.slice(m[0].length)}
  let unit="";const um=s.match(/^([A-Za-z]+)\.?\s+/);
  if(um&&qty!=null){const u=UNITS[um[1]]||(um[1].length>1?UNITS[um[1].toLowerCase()]:null);if(u){unit=u;s=s.slice(um[0].length)}}
  s=s.replace(/^of\s+/,"");const ci=s.indexOf(",");let item=ci>0?s.slice(0,ci):s,note=ci>0?s.slice(ci+1).trim():"";
  return{qty,unit,item:item.trim(),note}}
function ingText(i){return[fmtQty(i.qty),i.unit,i.item].filter(Boolean).join(" ")+(i.note?", "+i.note:"")}
function normUnit(u){u=(u||"").trim();return UNITS[u]||UNITS[u.toLowerCase()]||u.toLowerCase()}
function normItem(s){s=(s||"").toLowerCase().replace(/\(.*?\)/g,"").replace(/[^a-z\s-]/g,"").replace(/\s+/g," ").trim();
  if(s.length>3&&/(oes|ies)$/.test(s))s=s.replace(/ies$/,"y").replace(/oes$/,"o");else if(s.length>3&&/s$/.test(s)&&!/(ss|us|is)$/.test(s))s=s.slice(0,-1);return s}
const KW={"Produce":/(onion|garlic|shallot|lemon|lime|orange|apple|banana|berr|tomato|potato|carrot|celery|pepper(?!corn)|lettuce|spinach|kale|cilantro|parsley|basil|mint|dill|scallion|ginger|avocado|cucumber|zucchini|squash|mushroom|broccoli|cabbage|corn|bean sprout|herb|thyme|rosemary|jalape|chile|fruit|grape|pear|peach|leek|arugula|radish)/,
"Meat & Seafood":/(chicken|beef|pork|turkey|sausage|bacon|lamb|shrimp|salmon|fish|tuna|cod|steak|ground|prosciutto|ham|chorizo)/,
"Dairy & Eggs":/(milk|butter|cream|cheese|yogurt|egg|parmesan|mozzarella|feta|ricotta|half-and-half)/,
"Bakery":/(bread|tortilla|bun|roll|pita|baguette|naan)/,
"Spices":/(salt|pepper|cumin|paprika|oregano|cinnamon|chili powder|turmeric|nutmeg|spice|seasoning|bay leaf|flake|coriander|cardamom|clove)/,
"Frozen":/(frozen|ice cream)/,
"Pantry":/(flour|sugar|oil|vinegar|rice|pasta|noodle|bean|lentil|broth|stock|sauce|honey|syrup|oat|baking|vanilla|soy|mustard|mayo|ketchup|nut|seed|chocolate|can|tomato paste|coconut milk|cornstarch|yeast|quinoa)/};
function guessSection(item){const s=(item||"").toLowerCase();if(/\b(canned|cans?|jarred|dried|boxed)\b/.test(s))return"Pantry";for(const k of ["Frozen","Spices","Meat & Seafood","Dairy & Eggs","Bakery","Produce","Pantry"])if(KW[k].test(s))return k;return"Other"}
function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2400)}

/* ---------- storage ---------- */
const LKEY="mise-v1";
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LKEY)||"null");if(d){S.recipes=d.recipes||{};S.plan=d.plan||{days:{}};S.shop=d.shop||{weeks:{}}}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify({recipes:S.recipes,plan:S.plan,shop:S.shop}))}catch(e){}}
function docFor(id){return id==="plan"?S.plan:id==="shop"?S.shop:S.recipes[id]}
/* Cloud storage: one Supabase table, recipe_docs(user_id, id, data jsonb). Rows are recipes ("r_…"), the meal "plan" and the "shop" list.
   Row-level security keeps each person's rows private. This browser keeps a cache so the app opens instantly and works offline. */
const CFG=window.MISE_CONFIG||{},OWNK="mise-owner",DIRTYK="mise-dirty",TABLE="recipe_docs";
let sb=null,user=null,pending=0,syncing=false,firstSync=true;
function cloud(){return mode==="cloud"&&sb&&user}
function getDirty(){try{return new Set(JSON.parse(localStorage.getItem(DIRTYK)||"[]"))}catch(e){return new Set()}}
function setDirty(set){try{set.size?localStorage.setItem(DIRTYK,JSON.stringify([...set])):localStorage.removeItem(DIRTYK)}catch(e){}}
function markDirty(id,on){const d=getDirty();on?d.add(id):d.delete(id);setDirty(d)}
async function upsertDoc(id){const doc=docFor(id);if(!doc)return deleteDoc(id);
  const{error}=await sb.from(TABLE).upsert({user_id:user.id,id,data:clone(doc),updated_at:new Date().toISOString()},{onConflict:"user_id,id"});if(error)throw error}
async function deleteDoc(id){const{error}=await sb.from(TABLE).delete().eq("user_id",user.id).eq("id",id);if(error)throw error}
function queue(id,fn){pending++;markDirty(id,true);
  queues[id]=(queues[id]||Promise.resolve()).then(fn).then(()=>markDirty(id,false)).catch(()=>{setSync("offline");toast("Couldn't reach your account. The change is kept here and will sync later.")}).finally(()=>pending--)}
function persist(id){if(id==="plan")prunePlan();saveLocal();if(cloud())queue(id,()=>upsertDoc(id))}
function remove(id){saveLocal();if(cloud())queue(id,()=>deleteDoc(id))}
function prunePlan(){const cut=dkey(addDays(new Date(),-70));for(const k in S.plan.days){if(k<cut||!S.plan.days[k].length)delete S.plan.days[k]}
  for(const k in S.shop.weeks)if(k<cut)delete S.shop.weeks[k]}

async function pull(){
  if(!cloud()||syncing||pending)return;syncing=true;setSync("syncing");
  try{
    for(const id of getDirty()){if(docFor(id))await upsertDoc(id);else await deleteDoc(id);markDirty(id,false)}
    const{data,error}=await sb.from(TABLE).select("id,data");if(error)throw error;
    if(pending)return;
    const remote={};data.forEach(r=>remote[r.id]=r.data);
    if(firstSync){firstSync=false;let owner=null;try{owner=localStorage.getItem(OWNK)}catch(e){}
      if(owner&&owner!==user.id){S.recipes={};S.plan={days:{}};S.shop={weeks:{}}}
      else if(!owner){ // recipes made before signing in move into the account
        const up=[];for(const id in S.recipes)if(!remote[id]){remote[id]=S.recipes[id];up.push(id)}
        if(!remote.plan&&Object.keys(S.plan.days).length){remote.plan=S.plan;up.push("plan")}
        if(!remote.shop&&Object.keys(S.shop.weeks).length){remote.shop=S.shop;up.push("shop")}
        for(const id of up)await upsertDoc(id);if(up.length)toast("Moved "+up.length+" item"+(up.length===1?"":"s")+" from this device into your account")}
      try{localStorage.setItem(OWNK,user.id)}catch(e){}}
    const rec={};for(const id in remote)if(id.startsWith("r_")&&remote[id])rec[id]=remote[id];
    S.recipes=rec;S.plan=remote.plan&&remote.plan.days?remote.plan:{days:{}};S.shop=remote.shop&&remote.shop.weeks?remote.shop:{weeks:{}};
    saveLocal();render();setSync("ok")}
  catch(e){setSync("offline")}
  finally{syncing=false}}

function initCloud(){
  if(!CFG.supabaseUrl||!CFG.supabaseKey){setSync();return}
  if(!window.supabase||!supabase.createClient){setSync("unavailable");return}
  sb=supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey);
  sb.auth.onAuthStateChange((ev,session)=>{const u=session&&session.user||null;
    if((u&&u.id)!==(user&&user.id)){user=u;mode=u?"cloud":"local";firstSync=true;setSync();if(u)setTimeout(pull,0)}
    if(ev==="SIGNED_IN"&&location.hash.includes("access_token"))history.replaceState(null,"",location.pathname)});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pull()});
  window.addEventListener("online",()=>pull())}
let syncState="";
function setSync(s){if(s!==undefined)syncState=s;const n=$("localNote"),b=$("signBanner");
  const configured=!!sb;
  b.hidden=!configured||!!user;
  n.textContent=user?(syncState==="offline"?"Offline. Changes are kept here and sync when you reconnect.":"Synced to your account ("+(user.email||"signed in")+")."):
    syncState==="unavailable"?"Couldn't load the sync service, so recipes are saved in this browser only.":configured?"Saved in this browser only. Sign in to keep recipes in your account.":"Recipes, plans and lists are saved in this browser on this device.";
  n.hidden=false}
async function sendLink(email){const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error}
async function signOut(){await sb.auth.signOut().catch(()=>{});S.recipes={};S.plan={days:{}};S.shop={weeks:{}};try{localStorage.removeItem(LKEY);localStorage.removeItem(OWNK);localStorage.removeItem(DIRTYK)}catch(e){}render();closeSheet();toast("Signed out")}
function toggleFav(id){const r=S.recipes[id];if(!r)return;r.fav=!r.fav;r.updated=Date.now();persist(id);render();toast(r.fav?"Added to favorites":"Removed from favorites")}

/* ---------- recipe reading: Claude in-app, or the viewer's own API key outside Claude ---------- */
const KEYK="mise-api-key",MODEL="claude-sonnet-5-5";
function apiKey(){try{return localStorage.getItem(KEYK)||""}catch(e){return""}}
function toJpeg(file){return new Promise((ok,bad)=>{const img=new Image();img.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);ok(c.toDataURL("image/jpeg",.85).split(",")[1])};img.onerror=()=>bad({code:"image_rejected"});img.src=URL.createObjectURL(file)})}
function parseJSON(t){try{return JSON.parse(t)}catch(e){}const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1])}catch(e){}}const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}throw{code:"invalid_json"}}
const apiSample={api:true,
  limits:async()=>({images:{maxCount:6,mediaTypes:["image/jpeg","image/png","image/webp","image/gif","image/heic"]}}),
  json:async(input,opt={})=>{
    const content=[];for(const f of [...(opt.images||[])])content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:await toJpeg(f)}});
    content.push({type:"text",text:input});
    const blocks=await apiCall({messages:[{role:"user",content}]},opt.signal);
    return parseJSON(blocks.filter(b=>b.type==="text").map(b=>b.text).join(""))},
  /* Anthropic fetches the page server-side with its web fetch tool, so the browser's cross-site limits don't apply. */
  fromUrl:async(url,prompt,signal)=>{
    const messages=[{role:"user",content:`Fetch this recipe page with the web_fetch tool: ${url}\n\n${prompt}`}];
    const tools=[{type:"web_fetch_20250910",name:"web_fetch",max_uses:3,max_content_tokens:40000}];
    let all=[];
    for(let round=0;round<4;round++){const r=await apiCall({messages,tools},signal,true);all=all.concat(r.content);
      if(r.stop_reason!=="pause_turn")break;messages.push({role:"assistant",content:r.content})}
    const errs=all.filter(b=>b.type==="web_fetch_tool_result"&&b.content&&b.content.type==="web_fetch_tool_result_error").map(b=>b.content.error_code);
    const ok=all.some(b=>b.type==="web_fetch_tool_result"&&b.content&&b.content.type==="web_fetch_result");
    if(!ok&&errs.length)throw{code:"fetch_"+errs[errs.length-1]};
    let last=-1;all.forEach((b,i)=>{if(b.type==="web_fetch_tool_result")last=i});
    const text=all.slice(last+1).filter(b=>b.type==="text").map(b=>b.text).join("");
    if(!ok&&!text)throw{code:"fetch_url_not_accessible"};
    return parseJSON(text)}};
async function apiCall(body,signal,full){const key=apiKey();if(!key)throw{code:"no_key"};
  let res;try{res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal,headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:MODEL,max_tokens:8000,...body})})}
  catch(e){throw{code:e&&e.name==="AbortError"?"cancelled":"upstream_error"}}
  if(!res.ok){let m="";try{m=(await res.json()).error?.message||""}catch(x){}
    throw{code:res.status===401||res.status===403?"bad_key":res.status===429?"rate_limited":res.status===413?"prompt_too_large":res.status===400?(/web.?fetch/i.test(m)?"fetch_disabled":"bad_request"):"upstream_error"}}
  const j=await res.json();return full?j:(j.content||[])}
let sampleP=null;
function getSample(){if(!sampleP)sampleP=((window.claude&&claude.use)?claude.use("sample"):Promise.resolve(null)).then(s=>s||apiSample);return sampleP}
function openSettings(){const k=apiKey();
  const acct=!sb?(CFG.supabaseUrl?`<p class="hint">The sync service didn't load. Check your connection and reload.</p>`:`<p class="hint">Account sync isn't set up for this site yet, so recipes are saved in this browser.</p>`):
    user?`<p style="margin:0">Signed in as <b>${esc(user.email||"")}</b>. Recipes, favorites, plans and shopping lists are saved to your account.</p><div class="row"><button class="btn" type="button" data-act="syncNow">Sync now</button><button class="btn danger" type="button" data-act="signOut">Sign out</button></div>`:
    `<form class="form" id="signForm"><label>Email<input class="field" id="emailIn" type="email" required autocomplete="email" placeholder="you@example.com"></label><p class="hint">We'll email you a sign-in link. Open it on this device to finish signing in. Recipes already in this browser move into your account.</p><div id="signStatus"></div><div><button class="btn primary" type="submit" id="signBtn">Email me a sign-in link</button></div></form>`;
  openSheet(`<div class="phead"><h2>Settings</h2>${closeBtn}</div>
  <div class="form"><h3 style="font-size:16px">Account</h3>${acct}</div>
  <hr style="border:none;border-top:1px solid var(--line);margin:20px 0">
  <form class="form" id="keyForm"><h3 style="font-size:16px">Recipe import</h3><label>Anthropic API key<input class="field" id="keyIn" type="password" autocomplete="off" placeholder="sk-ant-…" value="${esc(k)}"></label>
  <p class="hint">Optional. Links, screenshots and pasted text are read for free first. With a key, Claude steps in when the free method can't find the recipe, billed to your Anthropic account. The key is stored only in this browser and is sent only to Anthropic. Create one at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>.</p>
  <div class="row"><button class="btn primary" type="submit">Save key</button>${k?'<button class="btn danger" type="button" data-act="forgetKey">Remove key</button>':""}</div></form>`);
  $("keyForm").addEventListener("submit",e=>{e.preventDefault();const v=$("keyIn").value.trim();try{v?localStorage.setItem(KEYK,v):localStorage.removeItem(KEYK)}catch(x){}closeSheet();toast(v?"API key saved":"API key removed")});
  const sf=$("signForm");if(sf)sf.addEventListener("submit",async e=>{e.preventDefault();const em=$("emailIn").value.trim(),btn=$("signBtn"),st=$("signStatus");btn.disabled=true;st.innerHTML=`<div class="status"><span class="spin"></span>Sending…</div>`;
    try{await sendLink(em);st.innerHTML=`<p class="hint">Check <b>${esc(em)}</b> for a sign-in link. It can take a minute; look in spam if it doesn't arrive.</p>`}
    catch(x){st.innerHTML=`<p class="err">${/rate|seconds/i.test(x&&x.message||"")?"Too many sign-in emails. Wait a minute, then try again.":"Couldn't send the email. Check the address and try again."}</p>`;btn.disabled=false}})}

/* ---------- render ---------- */
function render(){renderRecipes();renderPlan();renderShop();renderBadge()}
function recipeArr(){return Object.values(S.recipes).filter(r=>r&&r.title).sort((a,b)=>a.title.localeCompare(b.title))}
function renderRecipes(){
  const all=recipeArr();
  const favN=all.filter(r=>r.fav).length;const cats=["All",...(favN?["__fav"]:[]),...[...new Set(all.map(r=>r.category).filter(Boolean))].sort()];
  if(!cats.includes(S.cat))S.cat="All";
  $("cats").innerHTML=all.length?cats.map(c=>`<button class="chip" data-act="cat" data-cat="${esc(c)}" aria-pressed="${c===S.cat}">${c==="__fav"?"★ Favorites ("+favN+")":esc(c)}</button>`).join(""):"";
  const q=S.q.toLowerCase().trim();
  const list=all.filter(r=>(S.cat==="All"||(S.cat==="__fav"?r.fav:r.category===S.cat))&&(!q||[r.title,r.category,...(r.tags||[]),...(r.ingredients||[]).map(i=>i.item)].join(" ").toLowerCase().includes(q)));
  const el=$("recipeList");
  if(!all.length){el.innerHTML=`<div class="empty"><h2>Your recipe book is empty</h2><p>Add a recipe from a screenshot, from text you copy off a recipe site, or type it in. Claude pulls out the ingredients and steps so they can feed your weekly plan and shopping list.</p><div class="row"><button class="btn primary" data-act="add">+ Add your first recipe</button><button class="btn" data-act="examples">Load 3 example recipes</button></div></div>`;return}
  el.innerHTML=`<p class="count">${list.length} of ${all.length} recipe${all.length===1?"":"s"}</p>`+(list.length?`<div class="grid">${list.map(card).join("")}</div>`:`<div class="empty"><p>No recipes match “${esc(S.q)}”${S.cat==="__fav"?" in your favorites":S.cat!=="All"?" in "+esc(S.cat):""}.</p></div>`)}

const PROMPT=`Extract the recipe. Reply with only one JSON object in this shape:
{"title":string,"category":one of ${JSON.stringify(CATS)},"tags":[up to 4 short lowercase tags such as cuisine, main protein, "vegetarian", "quick"],"servings":number|null,"time":string|null (total time like "45 min"),"ingredients":[{"qty":number|null (decimals, e.g. 1.5 for 1 1/2),"unit":string ("" if none; use tsp, tbsp, cup, oz, lb, g, kg, ml, l, clove, can, pinch, bunch, slice, package, stick),"item":string (the ingredient name only, e.g. "yellow onion"),"note":string (prep or detail like "diced", "" if none),"section":one of ${JSON.stringify(SECTIONS)}}],"steps":[string, one per step, short and complete],"notes":string ("" if none)}
Ignore ads, life stories, comments and nutrition panels. If there is no recipe, reply {"error":"short reason"}.`;

/* ---------- free recipe reading: structured data via Supabase, on-device OCR, and a text parser ---------- */
const CAT_RULES=[["Breakfast",/breakfast|brunch|pancake|waffle|oatmeal|oats|granola|omelet|frittata/],["Soup & Stew",/soup|stew|chili|chowder|bisque|ramen|pho/],["Salad",/salad|slaw/],["Dessert",/dessert|cookie|cake|brownie|pie\b|tart|pudding|ice cream|cupcake|fudge|crumble|cobbler/],["Drink",/drink|cocktail|smoothie|beverage|lemonade|latte|punch/],["Baking",/bread|baking|muffin|scone|biscuit|focaccia|loaf|rolls?\b/],["Sauce",/sauce|dressing|condiment|salsa|pesto|gravy|dip\b|marinade/],["Side",/side|vegetable dish/],["Snack",/snack|appetizer|starter|finger food/],["Lunch",/lunch|sandwich|wrap/],["Dinner",/dinner|main|entree|entrée|supper/]];
function mapCat(raw,extra){const s=(raw||"").toLowerCase();for(const[c,re]of CAT_RULES)if(re.test(s))return c;const t=(extra||"").toLowerCase();for(const[c,re]of CAT_RULES)if(c!=="Dinner"&&re.test(t))return c;return raw?raw.replace(/\b\w/g,m=>m.toUpperCase()):""}
function ingObjs(lines){return lines.map(parseLine).filter(Boolean).map(i=>({...i,section:guessSection(i.item)}))}
function fromStructured(r,url){return{title:r.title||"",category:mapCat(r.category,r.title),tags:r.tags||[],servings:r.servings||null,time:r.time||"",ingredients:ingObjs(r.ingredients||[]),steps:r.steps||[],notes:"",source:r.source||url}}

function parseRecipeText(raw){
  const lines=String(raw||"").replace(/\r/g,"").split("\n").map(l=>l.replace(/\s+/g," ").trim());
  const head=(re)=>(l)=>l.length<45&&re.test(l.replace(/^[#*\s]+/,""));
  const isIng=head(/^(ingredients?|what you('|’)?ll need|you('|’)?ll need|you will need|shopping list)\b\s*:?/i);
  const isDir=head(/^(directions?|instructions?|method|preparation|steps|how to make( it)?|to make)\b\s*:?/i);
  const isEnd=head(/^(notes?|tips?|cook('|’)?s notes?|nutrition|equipment|video|storage|recipe notes)\b\s*:?/i);
  const iI=lines.findIndex(isIng);if(iI<0)return null;
  const iD=lines.findIndex((l,i)=>i>iI&&isDir(l));
  const endAfter=from=>{const j=lines.findIndex((l,i)=>i>from&&isEnd(l));return j<0?lines.length:j};
  const ingStop=Math.min(iD>0?iD:lines.length,endAfter(iI));
  const ings=[];
  for(let l of lines.slice(iI+1,ingStop)){
    l=l.replace(/^[•\-–*▢□☐○●◯✓✔]\s*/,"");
    if(!l||(/:$/.test(l)&&l.length<40)||/^(scale|us customary|metric|1x|2x|3x|cups?\s*\/\s*grams)\b/i.test(l))continue;
    if(ings.length&&/^[a-z(]/.test(l))ings[ings.length-1]+=" "+l;else ings.push(l)}
  const steps=[];
  if(iD>0){const sl=lines.slice(iD+1,endAfter(iD));
    const NUM=/^(?:step\s*)?(\d{1,2})\s*[.):]\s*(.*)$/i,ONLY=/^(?:step\s*)?\d{1,2}[.):]?$/i;
    const numbered=sl.filter(l=>NUM.test(l)||ONLY.test(l)).length>=2;let cur="";const push=()=>{if(cur.trim())steps.push(cur.trim());cur=""};
    for(const l of sl){
      if(numbered){if(ONLY.test(l)){push();continue}const m=l.match(NUM);if(m){push();cur=m[2];continue}if(l)cur+=(cur?" ":"")+l}
      else{if(!l){push();continue}if(cur&&/[.!?)]$/.test(cur)&&/^[A-Z]/.test(l)){push()}cur+=(cur?" ":"")+l}}
    push()}
  const notesAt=lines.findIndex((l,i)=>i>Math.max(iI,iD)&&isEnd(l)&&/^notes?|tips?|cook/i.test(l));
  const notes=notesAt>0?lines.slice(notesAt+1).filter(Boolean).join(" ").slice(0,600):"";
  const skip=/^(jump to|print|pin|save|rate|share|home|menu|search|recipes?$|\d+(\.\d+)?\s*(stars?|reviews?|ratings?)|by\s)/i;
  const title=(lines.slice(0,iI).find(l=>l.length>=3&&l.length<=90&&!skip.test(l)&&!/^\d+$/.test(l)&&!/^(prep|cook|total|serves|servings|yield)\b/i.test(l))||"").replace(/[#*]/g,"").trim();
  const all=lines.join("\n");
  const sv=all.match(/\b(?:serves|servings|yield|makes)\b\s*:?\s*(\d+)/i);
  const tm=all.match(/\btotal(?:\s*time)?\s*:?\s*((?:\d+\s*(?:hours?|hrs?|h)\b\s*)?(?:\d+\s*(?:minutes?|mins?|m)\b)?)/i);
  const ingredients=ingObjs(ings);if(!ingredients.length)return null;
  return{title,category:mapCat("",title),tags:[],servings:sv?+sv[1]:null,time:tm&&tm[1].trim()?tm[1].trim().replace(/hours?|hrs?/i,"hr").replace(/minutes?|mins?/i,"min"):"",ingredients,steps,notes}}

let tessP=null;
function loadTess(){return tessP||(tessP=new Promise((ok,bad)=>{if(window.Tesseract)return ok(window.Tesseract);const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";s.onload=()=>window.Tesseract?ok(window.Tesseract):bad({code:"ocr_failed"});s.onerror=()=>{tessP=null;bad({code:"ocr_failed"})};document.head.append(s)}))}
async function ocr(files,signal,onProg){const T=await loadTess();let cur=0;
  let worker;try{worker=await T.createWorker("eng",1,{logger:m=>{if(m.status==="recognizing text")onProg((cur+m.progress)/files.length)}})}catch(e){throw{code:"ocr_failed"}}
  try{const out=[];for(cur=0;cur<files.length;cur++){if(signal.aborted)throw{code:"cancelled"};const{data}=await worker.recognize(files[cur]);out.push(data.text)}return out.join("\n")}
  finally{worker.terminate().catch(()=>{})}}

async function claudeExtract(input,opts,signal){const out=await apiSample.json(input,{...opts,signal});if(!out||typeof out!=="object"||out.error||!out.title)throw{code:"claude_no_recipe",detail:out&&out.error};return out}
async function importFromUrl(url,signal,say){
  let free="signed_out";
  if(cloud()){say("Opening the page…");
    try{const{data,error}=await sb.functions.invoke("recipe-from-url",{body:{url}});
      if(error){const st=error.context&&error.context.status;free=error.name==="FunctionsFetchError"?"fn_unreachable":st===404?"fn_missing":st===401?"signed_out":"failed"}
      else if(data&&data.recipe&&data.recipe.ingredients&&data.recipe.ingredients.length)return{recipe:fromStructured(data.recipe,url),via:"free"};
      else free=(data&&data.error)||"no_recipe_data"}
    catch(e){free="failed"}}
  if(signal.aborted)throw{code:"cancelled"};
  if(apiKey()&&free!=="bad_url"){say("Asking Claude to read the page. This usually takes 20–60 seconds.");return{recipe:{...await apiSample.fromUrl(url,PROMPT,signal).then(o=>{if(!o||o.error||!o.title)throw{code:"claude_no_recipe",detail:o&&o.error};return o}),source:url},via:"claude"}}
  throw{code:"free_"+free}}
async function importFromShots(files,signal,say){
  let text="";
  try{say("Getting text recognition ready…");text=await ocr(files,signal,p=>say("Reading text from "+(files.length>1?"your screenshots":"the screenshot")+"… "+Math.round(p*100)+"%"))}
  catch(e){if(e&&e.code==="cancelled")throw e;if(!apiKey())throw e}
  const r=text&&parseRecipeText(text);if(r)return{recipe:r,via:"free"};
  if(signal.aborted)throw{code:"cancelled"};
  if(apiKey()){say("Asking Claude to read the screenshots. This usually takes 20–60 seconds.");return{recipe:await claudeExtract(PROMPT+"\n\nThe recipe is in the attached screenshot(s), shown in order.",{images:files},signal),via:"claude"}}
  throw{code:"free_no_recipe_shot"}}
async function importFromText(text,url,signal,say){
  const r=parseRecipeText(text);if(r)return{recipe:{...r,source:url},via:"free"};
  if(apiKey()){say("Asking Claude to read the recipe. This usually takes 20–60 seconds.");return{recipe:{...await claudeExtract(PROMPT+"\n\nRecipe text:\n"+text.slice(0,40000),{},signal),source:url},via:"claude"}}
  throw{code:"free_no_recipe_text"}}

const IMPORT_ERR={
  free_signed_out:"Sign in (gear icon) to import from links, or add an Anthropic API key in Settings.",
  free_fn_missing:"Link import isn't switched on yet. Deploy the recipe-from-url function in Supabase (steps are in the README).",
  free_fn_unreachable:"Couldn't reach link import. If the recipe-from-url function isn't deployed in Supabase yet, see the README; otherwise check your connection.",
  free_no_recipe_data:"That page doesn't include a recipe card the app can read. Try a screenshot or paste the text instead.",
  free_unreachable:"That site couldn't be opened. It may block automated visits. Try a screenshot or paste the text instead.",
  free_bad_url:"That doesn't look like a web address. Check the link and try again.",
  free_failed:"Couldn't import from that link. Try again, or use a screenshot or pasted text.",
  free_no_recipe_shot:"Couldn't find an ingredients list in the screenshot. Make sure the “Ingredients” heading is visible, or use “Paste text”.",
  free_no_recipe_text:"Couldn't find an ingredients list. Include the “Ingredients” heading (and “Directions” for the steps) in what you paste.",
  ocr_failed:"Text recognition couldn't start. Check your connection and try again.",
  no_key:"Add your API key in Settings first.",bad_key:"Anthropic rejected the API key. Check it in Settings.",
  rate_limited:"Too many requests right now. Wait a minute and try again.",image_rejected:"One of the images couldn't be read. Use JPEG or PNG screenshots.",
  invalid_json:"The recipe came back in a form the app couldn't read. Try again.",prompt_too_large:"That's too long. Use just the recipe part.",
  bad_request:"Anthropic couldn't process that request. Try fewer or smaller screenshots.",fetch_disabled:"Website fetching is turned off for this API key's organization. Use a screenshot or paste the text.",
  fetch_url_not_accessible:"That page couldn't be opened. Check the link, or use a screenshot or pasted text.",fetch_url_not_allowed:"That site doesn't allow automated visits. Use a screenshot or paste the text instead."};
async function runImport(kind,p){
  const rb=$("readBtn");importCtl=new AbortController();const ctl=importCtl;
  const say=msg=>{const st=$("impStatus");if(st&&importCtl===ctl)st.innerHTML=`<div class="status"><span class="spin"></span><span>${esc(msg)}</span><button class="btn ghost" data-act="stopImport">Stop</button></div>`};
  if(rb)rb.disabled=true;say("Working…");
  try{const res=kind==="web"?await importFromUrl(p.url,ctl.signal,say):kind==="shot"?await importFromShots(p.files,ctl.signal,say):await importFromText(p.text,p.url,ctl.signal,say);
    if(ctl.signal.aborted)return;shotFiles=[];openEdit(null,{...res.recipe,via:res.via})}
  catch(e){const st=$("impStatus");if(!st)return;const c=e&&e.code;
    const msg=c==="cancelled"?"":c==="claude_no_recipe"?(e.detail?"No recipe found: "+e.detail:"Couldn't find a recipe in that."):IMPORT_ERR[c]||(String(c||"").startsWith("fetch_")?"The page couldn't be read. Try a screenshot or pasted text.":"Something went wrong reading the recipe. Try again.");
    st.innerHTML=msg?`<p class="err">${esc(msg)}</p>`:"";const b2=$("readBtn");if(b2)b2.disabled=false}
  finally{if(importCtl===ctl)importCtl=null}}

let editId=null,editSections={};
function openEdit(id,pre){editId=id;const r=id?S.recipes[id]:(pre||{});editSections={};
  (r.ingredients||[]).forEach(i=>{if(i.item&&i.section)editSections[normItem(i.item)]=i.section});
  const cats=[...new Set([...CATS,...recipeArr().map(x=>x.category).filter(Boolean)])];
  openSheet(`<div class="phead"><div><h2>${id?"Edit recipe":pre&&pre.title?"Check and save":"New recipe"}</h2>${pre&&pre.via?`<p class="hint">${pre.via==="claude"?"Claude filled this in.":"Read automatically."} Check the ingredients and steps, fix anything that's off, then save.</p>`:""}</div>${closeBtn}</div>
  <form class="form" id="editForm">
    <label>Name<input class="field" id="f-title" required value="${esc(r.title||"")}"></label>
    <div class="two"><label>Category<input class="field" id="f-cat" list="catList" value="${esc(r.category||"")}" placeholder="Dinner"></label><label>Total time<input class="field" id="f-time" value="${esc(r.time||"")}" placeholder="40 min"></label></div>
    <datalist id="catList">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    <div class="two"><label>Servings<input class="field" id="f-serv" type="number" min="1" step="1" value="${esc(r.servings||"")}"></label><label>Tags<input class="field" id="f-tags" value="${esc((r.tags||[]).join(", "))}" placeholder="chicken, quick"></label></div>
    <label>Ingredients, one per line<textarea class="field" id="f-ing" rows="8" placeholder="2 cups basmati rice&#10;1 yellow onion, diced">${esc((r.ingredients||[]).map(ingText).join("\n"))}</textarea></label>
    <label>Steps, one per line<textarea class="field" id="f-steps" rows="8">${esc((r.steps||[]).join("\n"))}</textarea></label>
    <label>Notes<textarea class="field" id="f-notes" rows="2">${esc(r.notes||"")}</textarea></label>
    <label>Source link<input class="field" id="f-src" value="${esc(r.source||"")}" placeholder="https://…"></label>
    <div class="row"><button class="btn primary" type="submit">Save recipe</button><button class="btn ghost" type="button" data-act="close">Cancel</button></div>
  </form>`);
  $("editForm").addEventListener("submit",e=>{e.preventDefault();saveEdit()})}
function saveEdit(){const v=id=>$(id).value.trim();
  const prev=editId?S.recipes[editId]:null,id=editId||uid();
  const ingredients=v("f-ing").split("\n").map(parseLine).filter(Boolean).map(i=>({...i,section:editSections[normItem(i.item)]||guessSection(i.item)}));
  const r={id,title:v("f-title")||"Untitled recipe",category:v("f-cat"),time:v("f-time"),servings:+v("f-serv")||null,tags:v("f-tags").split(",").map(t=>t.trim().toLowerCase()).filter(Boolean).slice(0,8),
    ingredients,steps:v("f-steps").split("\n").map(s=>s.trim().replace(/^(step\s*)?\d+[.):]\s*/i,"")).filter(Boolean),notes:v("f-notes"),source:v("f-src"),created:prev?.created||Date.now(),updated:Date.now()};
  if(prev?.example)r.example=true;
  S.recipes[id]=r;persist(id);render();toast(prev?"Recipe updated":"Recipe saved");openDetail(id)}

/* ---------- cooking mode ---------- */
const COOKK="mise-cook-";let cook=null,wakeLock=null;
function cookLoad(id){try{const d=JSON.parse(localStorage.getItem(COOKK+id)||"null");if(d&&Date.now()-d.t<12*3600e3)return{steps:new Set(d.s),ings:new Set(d.i)}}catch(e){}return{steps:new Set(),ings:new Set()}}
function cookSave(){if(!cook)return;try{localStorage.setItem(COOKK+cook.id,JSON.stringify({s:[...cook.steps],i:[...cook.ings],t:Date.now()}))}catch(e){}}
function cookClear(id){try{localStorage.removeItem(COOKK+id)}catch(e){}}
async function keepAwake(on){try{if(on&&"wakeLock" in navigator&&document.visibilityState==="visible"){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>{wakeLock=null;const n=$("awakeNote");if(n)n.textContent=""})}else if(!on&&wakeLock){await wakeLock.release();wakeLock=null}}catch(e){wakeLock=null}const n=$("awakeNote");if(n)n.textContent=wakeLock?"Screen stays on":""}
document.addEventListener("visibilitychange",()=>{if(cook&&document.visibilityState==="visible"&&!wakeLock)keepAwake(true)});
const TIME_RE=/(\d+(?:\.\d+)?|an?|one)(?:\s*(?:-|–|to)\s*(\d+(?:\.\d+)?))?\s*(hours?|hrs?|minutes?|mins?|seconds?|secs?)\b/gi;
function stepTimes(text){const out=[];text=text.replace(/(\d+|an?|one)\s*(?:hours?|hrs?)\s*(?:and\s*)?(\d+)\s*(?:minutes?|mins?)\b/gi,(all,h,mn)=>{const hh=/^\d+$/.test(h)?+h:1,sec=hh*3600+(+mn)*60;if(sec<=12*3600)out.push({sec,label:hh+" hr "+mn+" min"});return " "});for(const m of text.matchAll(TIME_RE)){const n=/^(an?|one)$/i.test(m[1])?1:parseFloat(m[1]);if(!n)continue;const u=m[3].toLowerCase();const mult=u.startsWith("h")?3600:u.startsWith("s")?1:60;const sec=Math.round(n*mult);if(sec<10||sec>12*3600)continue;
  const label=(m[2]?m[1]+"–"+m[2]:/^(an?|one)$/i.test(m[1])?"1":m[1])+" "+(mult===3600?"hr":mult===1?"sec":"min");if(!out.some(o=>o.sec===sec))out.push({sec,label})}return out.slice(0,3)}
function openCook(id){const r=S.recipes[id];if(!r)return;cook={id,...cookLoad(id)};
  let el=$("cook");if(!el){el=document.createElement("div");el.id="cook";el.className="cook";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");document.body.append(el)}
  el.hidden=false;document.body.classList.add("cooking");drawCook();keepAwake(true)}
function redrawCook(scroll){const d=$("cookIngs"),op=d?d.open:null;drawCook(scroll);const n=$("cookIngs");if(n&&op!==null)n.open=op}
function closeCook(){$("cook").hidden=true;document.body.classList.remove("cooking");keepAwake(false);cook=null}
function drawCook(scrollToCurrent){const r=S.recipes[cook.id];if(!r)return closeCook();const el=$("cook");
  const steps=r.steps||[],ings=r.ingredients||[];const done=cook.steps.size,cur=steps.findIndex((s,i)=>!cook.steps.has(i));
  const pct=steps.length?Math.round(done/steps.length*100):0;
  el.innerHTML=`<div class="in"><div class="cookbar"><div class="top1"><h2>${esc(r.title)}</h2><button class="btn" data-act="cookClose">Done</button></div>
    <div class="cookmeta"><span>${steps.length?(cur<0?"All steps done":"Step "+(cur+1)+" of "+steps.length):"No steps yet"}</span><span id="awakeNote">${wakeLock?"Screen stays on":""}</span></div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span style="width:${pct}%"></span></div></div>
  ${ings.length?`<details ${done?"":"open"} id="cookIngs"><summary>Ingredients <small>${cook.ings.size} of ${ings.length} ready${scale!==1?" · ×"+esc(fmtQty(scale)):""}</small></summary>
    ${ings.map((i,ix)=>`<label class="cing${cook.ings.has(ix)?" done":""}"><input type="checkbox" data-act="cookIng" data-ix="${ix}" ${cook.ings.has(ix)?"checked":""}><span class="q">${esc([fmtQty(i.qty!=null?i.qty*scale:null),i.unit].filter(Boolean).join(" "))}</span><span>${esc(i.item)}${i.note?` <span style="color:var(--muted)">${esc(i.note)}</span>`:""}</span></label>`).join("")}</details>`:""}
  <div class="csteps">${steps.map((s,ix)=>{const d=cook.steps.has(ix),times=stepTimes(s);
    return`<div class="cstep${d?" done":""}${ix===cur?" current":""}" id="cs${ix}"><button class="ccheck" data-act="cookStep" data-ix="${ix}" aria-pressed="${d}" aria-label="${d?"Mark step "+(ix+1)+" not done":"Mark step "+(ix+1)+" done"}">${d?"✓":ix+1}</button>
      <div><div class="ctext" data-act="cookStep" data-ix="${ix}">${esc(s)}</div>${times.length&&!d?`<div class="ctimers">${times.map(t=>`<button class="tbtn" data-act="timer" data-sec="${t.sec}" data-label="${esc("Step "+(ix+1)+" · "+t.label)}">⏱ ${esc(t.label)}</button>`).join("")}</div>`:""}</div></div>`}).join("")}</div>
  ${steps.length&&cur<0?`<div class="finish"><h3>All done. Enjoy!</h3><p class="hint" style="margin:0">Your checkmarks clear when you finish.</p><div class="row"><button class="btn primary" data-act="cookFinish">Finish cooking</button><button class="btn ghost" data-act="cookReset">Start over</button></div></div>`:
    done||cook.ings.size?`<div style="margin-top:18px"><button class="btn ghost" data-act="cookReset">Clear checkmarks</button></div>`:""}</div>`;
  if(scrollToCurrent&&cur>=0){const c=$("cs"+cur);if(c){const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;c.scrollIntoView({behavior:reduce?"auto":"smooth",block:"center"})}}}

/* timers keep running when cooking mode is closed; they show in a bar above the tabs */
let timers=[],tick=null,actx=null;
function startTimer(sec,label){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}
  timers.push({id:Math.random().toString(36).slice(2),label,end:Date.now()+sec*1000,ring:false});drawTimers();if(!tick)tick=setInterval(drawTimers,1000);toast("Timer started")}
function beep(){try{if(!actx)return;const t0=actx.currentTime;for(let k=0;k<3;k++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,t0+k*.35);g.gain.exponentialRampToValueAtTime(.3,t0+k*.35+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+k*.35+.28);o.connect(g).connect(actx.destination);o.start(t0+k*.35);o.stop(t0+k*.35+.3)}}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
function drawTimers(){let bar=$("timerbar");if(!bar){bar=document.createElement("div");bar.id="timerbar";bar.className="timerbar";bar.setAttribute("aria-live","polite");document.body.append(bar)}
  const now=Date.now();for(const t of timers)if(!t.ring&&t.end<=now){t.ring=true;t.rang=now;beep();toast(t.label+" is done")}
  for(const t of timers)if(t.ring&&now-t.rang>=10000&&now-t.rang<11000)beep();
  bar.innerHTML=timers.map(t=>{const left=Math.max(0,Math.ceil((t.end-now)/1000)),h=Math.floor(left/3600),m=Math.floor(left%3600/60),s=left%60;
    return`<div class="timer${t.ring?" ring":""}"><span>${esc(t.label)}</span><b>${t.ring?"Done":(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0")}</b><button data-act="timerStop" data-tid="${t.id}" aria-label="${t.ring?"Dismiss":"Cancel"} timer">×</button></div>`}).join("");
  bar.hidden=!timers.length;if(!timers.length&&tick){clearInterval(tick);tick=null}}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-tab]");if(!t)return;
  if(t.dataset.tab&&!t.dataset.act){if($("sheet").hidden===false)closeSheet();setView(t.dataset.tab);return}
  const a=t.dataset.act;
  if(a==="add"){openAdd()}
  else if(a==="close"){closeSheet()}
  else if(a==="settings"){openSettings()}
  else if(a==="cookStart"){openCook(openId)}
  else if(a==="cookClose"){closeCook()}
  else if(a==="cookStep"){const ix=+t.dataset.ix;const was=cook.steps.has(ix);was?cook.steps.delete(ix):cook.steps.add(ix);cookSave();redrawCook(!was)}
  else if(a==="cookReset"){cook.steps.clear();cook.ings.clear();cookClear(cook.id);drawCook();$("cook").scrollTo(0,0)}
  else if(a==="cookFinish"){cookClear(cook.id);closeCook();toast("Nice work!")}
  else if(a==="timer"){startTimer(+t.dataset.sec,t.dataset.label)}
  else if(a==="timerStop"){timers=timers.filter(x=>x.id!==t.dataset.tid);drawTimers()}
  else if(a==="fav"){toggleFav(t.dataset.id);if(!$("sheet").hidden&&openId===t.dataset.id&&$("delBtn"))drawDetail()}
  else if(a==="syncNow"){pull().then(()=>toast(syncState==="offline"?"Couldn't reach your account":"Synced"))}
  else if(a==="signOut"){if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Tap again to sign out";return}signOut()}
  else if(a==="forgetKey"){try{localStorage.removeItem(KEYK)}catch(x){}closeSheet();toast("API key removed")}
  else if(a==="examples"){loadExamples()}
  else if(a==="cat"){S.cat=t.dataset.cat;renderRecipes()}
  else if(a==="open"){openDetail(t.dataset.id)}
  else if(a==="week"){const d=+t.dataset.d;S.week=d?addDays(S.week,d):sow(new Date());render()}
  else if(a==="planAdd"){openPicker(t.dataset.date)}
  else if(a==="pickRecipe"){(S.plan.days[pickDate]||(S.plan.days[pickDate]=[])).push(t.dataset.id);persist("plan");closeSheet();render();toast("Added to plan")}
  else if(a==="unplan"){const arr=S.plan.days[t.dataset.date]||[];arr.splice(+t.dataset.ix,1);persist("plan");render()}
  else if(a==="toPlan"){openDayPicker()}
  else if(a==="pickDay"){const k=t.dataset.date;(S.plan.days[k]||(S.plan.days[k]=[])).push(openId);persist("plan");const d=new Date(k+"T12:00");S.week=sow(d);closeSheet();render();toast("Added to "+DOW[d.getDay()]+" "+MON[d.getMonth()]+" "+d.getDate())}
  else if(a==="edit"){openEdit(openId)}
  else if(a==="del"){if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Tap again to delete";setTimeout(()=>{if(t.isConnected){t.classList.remove("armed");t.textContent="Delete"}},3000);return}
    const id=openId;delete S.recipes[id];let changed=false;for(const k in S.plan.days){const n=S.plan.days[k].filter(x=>x!==id);if(n.length!==S.plan.days[k].length){S.plan.days[k]=n;changed=true}}
    remove(id);if(changed)persist("plan");closeSheet();render();toast("Recipe deleted")}
  else if(a==="scale"){scale=Math.max(.5,scale+(+t.dataset.d)*(S.recipes[openId]?.servings?1/S.recipes[openId].servings*2:1));scale=Math.round(scale*100)/100;drawDetail()}
  else if(a==="mode"){importMode=t.dataset.m;drawAdd()}
  else if(a==="blank"){openEdit(null,null)}
  else if(a==="readShot"){if(shotFiles.length)runImport("shot",{files:shotFiles})}
  else if(a==="readText"){const txt=$("textIn").value.trim(),url=$("linkIn").value.trim();if(!txt){$("impStatus").innerHTML=`<p class="err">Paste the recipe text first. To import straight from a link, use the Website tab.</p>`;return}runImport("text",{text:txt,url})}
  else if(a==="stopImport"){if(importCtl)importCtl.abort()}
  else if(a==="extraDel"){const w=shopWeek();w.extras.splice(+t.dataset.ix,1);persist("shop");renderShop();renderBadge()}
  else if(a==="clearChecked"){const w=shopWeek(),items=shoppingItems(S.week);let n=0;items.forEach(i=>{if(w.checked[i.key])n++});const ex=w.extras.filter(x=>x.done).length;
    w.checked={};w.extras=w.extras.filter(x=>!x.done);persist("shop");render();toast(n+ex?"Cleared "+(n+ex)+" checked item"+(n+ex===1?"":"s"):"Nothing was checked")}
  else if(a==="copy"){const w=S.shop.weeks[dkey(S.week)]||{checked:{},extras:[]},items=shoppingItems(S.week).filter(i=>!w.checked[i.key]);
    const by={};items.forEach(i=>(by[i.section]||(by[i.section]=[])).push(i));let txt="Shopping list · "+weekLabel(S.week)+"\n";
    SECTIONS.forEach(s=>{if(by[s]){txt+="\n"+s+"\n"+by[s].map(i=>"• "+i.item+(qtyLabel(i)?" ("+qtyLabel(i)+")":"")).join("\n")+"\n"}});
    const ex=(w.extras||[]).filter(x=>!x.done);if(ex.length)txt+="\nAlso buy\n"+ex.map(x=>"• "+x.text).join("\n")+"\n";
    navigator.clipboard.writeText(txt).then(()=>toast("List copied")).catch(()=>{openSheet(`<div class="phead"><h2>Copy your list</h2>${closeBtn}</div><textarea class="field" id="copyBox" rows="14" readonly>${esc(txt)}</textarea>`);const b=$("copyBox");b.focus();b.select()})}
});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.act==="cookIng"&&cook){const ix=+t.dataset.ix;t.checked?cook.ings.add(ix):cook.ings.delete(ix);cookSave();redrawCook(false);return}
  if(t.dataset.act==="check"){const w=shopWeek();if(t.checked)w.checked[t.dataset.key]=1;else delete w.checked[t.dataset.key];persist("shop");renderShop();renderBadge()}
  else if(t.dataset.act==="extra"){const w=shopWeek();w.extras[+t.dataset.ix].done=t.checked;persist("shop");renderShop();renderBadge()}});
$("q").addEventListener("input",e=>{S.q=e.target.value;renderRecipes()});
$("extraForm").addEventListener("submit",e=>{e.preventDefault();const v=$("extraIn").value.trim();if(!v)return;const w=shopWeek();w.extras.push({text:v,done:false});$("extraIn").value="";persist("shop");renderShop();renderBadge()});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(cook){closeCook();return}if(!$("sheet").hidden)closeSheet()});

loadLocal();render();initCloud();setSync();
</script>
