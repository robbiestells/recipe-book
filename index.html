<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mise en Place</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Permanent+Marker&display=swap">
<style>
/* Ticket rail: a restaurant pass. Brushed-steel ground, recipes as thermal-paper tickets clipped to chrome rails,
   a red LED order ticker, receipts that feed from a printer. Phone-first; rails reflow to 3–4 tickets on wide screens. */
:root{
  --steel1:#CDD2D7; --steel2:#B6BCC2; --gink:#161616; --glabel:#3A3F44;
  --paper:#FFFFFF; --ink:#161616; --muted:#5C6166; --rule:#161616;
  --red:#C8102E; --red-hi:#C8102E; --dark:#1E2226; --dark-ink:#FFFFFF; --dark-muted:#AEB4BA;
  --led:#FF4A3D; --go:#3CFF7A; --clip1:#6A7178; --clip2:#2F3439;
  --chrome:linear-gradient(180deg,#F4F6F8 0%,#A3ABB3 45%,#6C747C 58%,#C9CED3 100%);
  --f-cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --f-mark:"Permanent Marker","Comic Sans MS",cursive;
  --tabh:64px;
  /* legacy names still used by a few helpers */
  --bg:var(--steel1); --surface:var(--paper); --sunk:#EEF0F2; --line:#161616; --basil:var(--red); --basil-ink:#FFFFFF; --saffron:#E09400; --tomato:var(--red);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --steel1:#2C3237; --steel2:#1D2125; --gink:#ECEFF2; --glabel:#AEB4BA;
  --paper:#ECEAE4; --ink:#161616; --muted:#55595E; --red-hi:#FF6B6B; --dark:#111316; --dark-muted:#A3A9AF;
  --clip1:#8A9198; --clip2:#41474D; --sunk:#DCDAD4;
  --chrome:linear-gradient(180deg,#C9CED3 0%,#7E868E 45%,#4D545B 58%,#959CA3 100%);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --steel1:#2C3237; --steel2:#1D2125; --gink:#ECEFF2; --glabel:#AEB4BA;
  --paper:#ECEAE4; --ink:#161616; --muted:#55595E; --red-hi:#FF6B6B; --dark:#111316; --dark-muted:#A3A9AF;
  --clip1:#8A9198; --clip2:#41474D; --sunk:#DCDAD4;
  --chrome:linear-gradient(180deg,#C9CED3 0%,#7E868E 45%,#4D545B 58%,#959CA3 100%);
  color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--steel2)}
body{min-height:100vh;color:var(--gink);font-family:var(--f-mono);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 3px),linear-gradient(180deg,var(--steel1) 0%,var(--steel2) 100%) fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#111214}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance;margin:0;line-height:.95}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red-hi);outline-offset:2px}
a{color:var(--red)}

/* Header + LED ticker */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,var(--steel1),color-mix(in srgb,var(--steel1) 92%,transparent));backdrop-filter:blur(6px)}
.led{height:30px;background:#111214;overflow:hidden;display:flex;align-items:center;border-bottom:2px solid #000}
.led .run{display:flex;white-space:nowrap;animation:marquee 26s linear infinite;font-weight:600;font-size:12px;letter-spacing:.18em;color:var(--led);text-shadow:0 0 6px rgba(255,74,61,.85),0 0 14px rgba(255,74,61,.4)}
.led .run span{padding-right:48px}
.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-block:10px}
.top .btn{padding:0 12px}
@media (max-width:420px){.wide{display:none}}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
.brand small{font-size:10px;letter-spacing:.18em;color:var(--glabel);text-transform:uppercase;white-space:nowrap}
.brand b{white-space:nowrap;font-family:var(--f-cond);font-weight:800;font-size:clamp(21px,5.6vw,34px);line-height:.95;text-transform:uppercase;letter-spacing:.01em;color:var(--gink)}
main{padding-block:10px calc(var(--tabh) + 34px + env(safe-area-inset-bottom,0px))}

/* Buttons */
.btn{border:2px solid var(--gink);background:transparent;color:var(--gink);border-radius:0;min-height:44px;padding:0 14px;font-family:var(--f-cond);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:transform .12s,background-color .15s,color .15s}
.btn:active{transform:translateY(2px) scale(.98)}
.btn.primary{background:var(--gink);color:var(--steel1);box-shadow:3px 3px 0 var(--red)}
.btn.fire{background:var(--red);border-color:var(--red);color:#FFFFFF;box-shadow:0 0 18px rgba(200,16,46,.4)}
.btn.ghost{border-color:transparent}
.btn.danger{color:var(--red-hi);border-color:var(--red-hi)}
.btn.armed{background:var(--red);border-color:var(--red);color:#FFFFFF;animation:shake .36s ease}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{border:2px solid var(--gink);background:transparent;width:44px;height:44px;display:grid;place-items:center;color:var(--gink);font-size:20px;line-height:1;border-radius:0}
.iconbtn:active{transform:translateY(2px)}
.top .btn.primary{color:#FFFFFF;background:#161616;border-color:#161616}
:root[data-theme="dark"] .top .btn.primary{background:#ECEFF2;color:#161616;border-color:#ECEFF2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .top .btn.primary{background:#ECEFF2;color:#161616;border-color:#ECEFF2}}
.field{width:100%;min-height:44px;border:2px solid var(--ink);background:#FFFFFF;color:#161616;border-radius:0;padding:10px 12px;font-family:var(--f-mono);font-size:15px}
textarea.field{resize:vertical;min-height:90px;line-height:1.45}
.top .field,main .field{border-color:var(--gink)}
.search{display:flex;gap:8px;margin:4px 0 10px}

/* Station chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chip{flex:0 0 auto;min-height:42px;padding:0 12px;border:2px solid var(--gink);background:transparent;color:var(--gink);font-family:var(--f-cond);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;transition:background-color .15s,color .15s,transform .12s}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:var(--gink);color:var(--steel1)}
.chip.fav{border-color:var(--red-hi);color:var(--red-hi)}
.chip.fav[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#FFFFFF}
.count{font-size:11px;letter-spacing:.14em;color:var(--glabel);margin:6px 0 4px;text-transform:uppercase;display:flex;justify-content:space-between}

/* Rails + tickets */
.rail{margin-top:18px}
.bar{position:relative;height:14px;overflow:hidden;background:var(--chrome);box-shadow:0 3px 4px rgba(0,0,0,.3);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.bar::after{content:"";position:absolute;top:0;bottom:0;left:0;width:44px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);animation:glint 6s ease-in-out infinite;animation-delay:var(--gd,1s)}
.hooks{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:16px;margin-top:-4px;align-items:start}
.tk{--r:0deg;position:relative;transform:rotate(var(--r));transform-origin:top center;transition:translate .2s ease,filter .2s ease;min-width:0}
.tk:hover{translate:0 6px;filter:drop-shadow(0 12px 8px rgba(0,0,0,.2))}
.tk.hang{animation:hang 950ms cubic-bezier(.2,.8,.3,1) var(--d,0ms) both}
.clip{position:absolute;top:-8px;left:50%;margin-left:-16px;width:32px;height:20px;border-radius:3px 3px 7px 7px;background:linear-gradient(180deg,var(--clip1),var(--clip2));box-shadow:0 1px 2px rgba(0,0,0,.4);z-index:3;pointer-events:none}
.tkmain{display:flex;flex-direction:column;gap:7px;width:100%;border:none;text-align:left;background:var(--paper);color:var(--ink);padding:16px 11px 10px;box-shadow:0 8px 12px -6px rgba(0,0,0,.35);font-family:var(--f-mono)}
.tkmain:active{translate:0 3px}
.tkhead{display:flex;justify-content:space-between;gap:6px;font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.print{position:relative;height:58px;overflow:hidden;background:radial-gradient(circle,#161616 0 1.1px,transparent 1.4px) 0 0/4px 4px,var(--paper)}
.print::before{content:"";position:absolute;inset:0;background:linear-gradient(var(--ga,115deg),rgba(255,255,255,.92),rgba(255,255,255,.15) 55%,rgba(255,255,255,.78));z-index:1}
.print img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.1) contrast(1.04);z-index:2}
.print.has::before{background:radial-gradient(circle,rgba(0,0,0,.1) 0 .7px,transparent 1px) 0 0/3px 3px;z-index:3}
.print,.tktitle,.dash{display:block}
.tktitle{font-family:var(--f-cond);font-weight:700;font-size:21px;line-height:1;text-transform:uppercase;overflow-wrap:anywhere}
.dash{border-top:1.5px dashed var(--rule)}
.tkrows{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:11px;text-transform:uppercase}
.tkrows span:nth-child(odd){color:var(--muted)}
.tkrows span:nth-child(even){text-align:right;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tear{height:8px;background:linear-gradient(135deg,var(--paper) 33%,transparent 33%) 0 0/10px 10px repeat-x,linear-gradient(225deg,var(--paper) 33%,transparent 33%) 0 0/10px 10px repeat-x}
.stamp{position:absolute;right:6px;top:70px;z-index:4;pointer-events:none;border:2px solid var(--red);color:var(--red);background:rgba(255,255,255,.82);font-family:var(--f-cond);font-weight:800;font-size:13px;letter-spacing:.08em;padding:1px 6px;transform:rotate(-9deg)}
.stamp.thunk{animation:thunk 420ms cubic-bezier(.3,1.4,.5,1) var(--sd,0ms) both}
.marker{position:absolute;left:12px;top:44px;z-index:4;pointer-events:none;font-family:var(--f-mark);font-size:16px;color:var(--red);transform:rotate(-7deg)}
.marker i{display:block;font-style:normal}
.hang .marker i{animation:write 700ms steps(12) var(--sd,0ms) both}
.printin .marker i{animation:write 700ms steps(12) 1.1s both}
.star{position:absolute;right:6px;top:8px;z-index:5;width:34px;height:34px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);display:grid;place-items:center;font-size:17px;line-height:1;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.star[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#FFFFFF}
.star.pop{animation:pop 380ms ease}

/* Empty states, banners */
.empty{margin-top:22px;padding:24px 20px;border:3px dashed var(--glabel);display:grid;gap:12px;justify-items:start}
.empty h2{font-size:30px;color:var(--gink)}
.empty p{margin:0;color:var(--glabel);max-width:52ch;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.banner{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--paper);color:var(--ink);padding:14px;margin:8px 0 6px;box-shadow:0 8px 12px -6px rgba(0,0,0,.3);transform:rotate(-.5deg)}
.banner p{margin:0;font-size:13px;max-width:46ch}
.banner b{font-family:var(--f-mark);font-weight:400;color:var(--red);font-size:16px;display:block}
.banner .btn{border-color:var(--ink);color:var(--ink)}
.local{font-size:11px;letter-spacing:.06em;color:var(--glabel);text-align:center;margin-top:28px;text-transform:uppercase}

/* Week */
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 12px}
.weekbar h2{font-size:28px;text-align:center;color:var(--gink)}
.weekbar .btn.ghost{min-height:30px;font-size:13px;color:var(--red-hi)}
.summary{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;background:#111214;color:#FFFFFF;padding:12px 14px;margin-bottom:16px;border-bottom:3px solid var(--red)}
.summary .nums{display:flex;gap:18px}
.summary .nums div{display:flex;flex-direction:column}
.summary .nums b{font-family:var(--f-mono);font-weight:600;font-size:28px;line-height:1;color:var(--led);text-shadow:0 0 8px rgba(255,74,61,.7)}
.summary .nums span{font-size:10px;letter-spacing:.16em;color:#AEB4BA}
.summary .btn{border-color:#FFFFFF;color:#FFFFFF}
.days{display:grid;gap:12px}
.day{position:relative;display:grid;grid-template-columns:76px minmax(0,1fr);background:var(--paper);color:var(--ink);box-shadow:0 8px 12px -6px rgba(0,0,0,.3);min-height:70px}
.day:nth-child(odd){transform:rotate(-.35deg)}.day:nth-child(even){transform:rotate(.3deg)}
.days.hang .day{animation:slideIn 520ms cubic-bezier(.2,.8,.3,1) var(--d,0ms) both}
.dstub{padding:10px 8px 10px 12px;border-right:2px dashed var(--rule);display:flex;flex-direction:column;justify-content:center}
.dstub b{font-family:var(--f-cond);font-weight:800;font-size:26px;line-height:1;text-transform:uppercase}
.dstub span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.day.today .dstub b{color:var(--red)}
.day.today::after{content:"TODAY";position:absolute;right:10px;top:-10px;border:2px solid var(--red);color:var(--red);background:rgba(255,255,255,.9);font-family:var(--f-cond);font-weight:800;font-size:13px;letter-spacing:.1em;padding:0 6px;transform:rotate(6deg)}
.meals{display:grid;gap:4px;padding:8px 10px;min-width:0}
.meal{display:flex;align-items:center;gap:6px;min-width:0;border-bottom:1px dotted #9AA0A6}
.meal button.t{flex:1;min-width:0;border:none;background:none;text-align:left;padding:8px 0;font-family:var(--f-cond);font-weight:700;font-size:19px;text-transform:uppercase;line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.meal .x{border:none;background:none;width:36px;height:36px;font-size:20px;color:var(--muted)}
.addmeal{justify-self:start;min-height:36px;border:1.5px dashed var(--ink);background:transparent;padding:0 10px;font-family:var(--f-cond);font-weight:700;font-size:15px;letter-spacing:.08em;color:var(--ink);text-transform:uppercase}

/* Order (shopping) */
.shophead{display:flex;flex-direction:column;gap:10px;margin:6px 0 10px}
.shophead .btn{padding:0 8px;font-size:14px;letter-spacing:.04em}
.shophead h2{font-size:34px;color:var(--gink)}
.shophead .meta{font-size:10px;letter-spacing:.18em;color:var(--glabel);text-transform:uppercase}
.extraform{display:flex;gap:8px;margin-bottom:12px}
.printer{position:relative;z-index:2;height:26px;background:linear-gradient(180deg,#3D4348,#24282C);box-shadow:0 3px 5px rgba(0,0,0,.35);display:flex;align-items:center;gap:10px;padding:0 10px}
.printer .slot{flex:1;height:4px;border-radius:2px;background:#0D0F11}
.printer .lamp{width:8px;height:8px;border-radius:50%;background:var(--go);box-shadow:0 0 8px var(--go)}
.printer.busy{animation:vibrate .12s linear 14}
.printer.busy .lamp{animation:blink .5s steps(2) infinite}
.printer small{font-size:9px;letter-spacing:.14em;color:#AEB4BA}
.paperwell{overflow:hidden;margin-top:-6px;padding-bottom:24px}
.rwrap{width:min(100%,460px);margin:0 auto}
.rwrap.feed{animation:feed 1.6s steps(18) both}
.rwrap.tearing{animation:tearOff 900ms cubic-bezier(.5,0,.8,.4) forwards}
.receipt{position:relative;background:var(--paper);color:var(--ink);padding:16px 16px 12px;box-shadow:0 10px 16px -8px rgba(0,0,0,.4)}
.rhead{text-align:center;display:flex;flex-direction:column;gap:2px;padding-bottom:8px;border-bottom:1.5px dashed var(--rule);margin-bottom:6px}
.rhead b{font-family:var(--f-cond);font-weight:800;font-size:22px;letter-spacing:.1em}
.rhead span{font-size:10.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.sec{margin-top:8px}
.sec h3{font-size:16px;letter-spacing:.14em;margin:0 0 2px}
.item{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:44px;padding:2px 0;border-bottom:1px dotted #B4B9BE}
.item input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:#161616}
.item label{display:contents;cursor:pointer}
.item .name{min-width:0;overflow-wrap:anywhere;font-size:13.5px;text-transform:uppercase;background:linear-gradient(var(--red),var(--red)) no-repeat 0 55%/0 2.5px;transition:background-size .3s ease,color .3s}
.item .from{font-size:10.5px;color:var(--muted);text-transform:none}
.item .qty{font-weight:600;font-size:12.5px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;text-transform:uppercase}
.item.done .name{background-size:100% 2.5px;color:var(--muted)}
.item.done .qty{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--red)}
.item .x{border:none;background:none;width:32px;height:32px;font-size:18px;color:var(--muted)}
.rfoot{display:flex;justify-content:space-between;gap:8px;font-size:11px;letter-spacing:.08em;margin-top:10px;padding-top:8px;border-top:1.5px dashed var(--rule)}
.barcode{height:34px;margin-top:8px;background:repeating-linear-gradient(90deg,#161616 0 2px,transparent 2px 3px,#161616 3px 4px,transparent 4px 7px,#161616 7px 10px,transparent 10px 11px,#161616 11px 12px,transparent 12px 15px)}
.bigstamp{position:absolute;left:50%;top:45%;z-index:6;pointer-events:none;padding:6px 12px;border:4px solid var(--red);color:var(--red);background:rgba(255,255,255,.86);font-family:var(--f-cond);font-weight:800;font-size:34px;line-height:1;letter-spacing:.06em;white-space:nowrap;transform:translate(-50%,-50%) rotate(-12deg);animation:slam 460ms cubic-bezier(.3,1.4,.5,1) both}
.cleared{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;border:2px dashed var(--muted);padding:8px 10px;margin:6px 0;font-size:12px;color:var(--muted)}

/* Bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--dark);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabh)}
.tab{border:none;border-top:4px solid transparent;background:none;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;color:var(--dark-muted);font-family:var(--f-cond);font-weight:700;font-size:17px;letter-spacing:.1em;text-transform:uppercase;transition:color .15s,border-color .15s}
.tab svg{width:20px;height:20px}
.tab[aria-selected="true"]{color:#FFFFFF;border-top-color:var(--red)}
.badge{display:inline-block;background:var(--red);color:#FFFFFF;font-family:var(--f-mono);font-size:11px;letter-spacing:0;padding:1px 5px;margin-left:4px}
.badge.pulse{animation:pulse .6s ease}

/* Sheets: a ticket that slides up */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(17,18,20,.55);animation:fadeIn .2s ease both}
.panel{position:relative;background:var(--paper);color:var(--ink);width:100%;max-width:640px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow:auto;padding:22px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));animation:up .28s cubic-bezier(.2,.9,.3,1) both;box-shadow:0 -8px 24px rgba(0,0,0,.35)}
.panel::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(90deg,var(--rule) 0 8px,transparent 8px 14px);opacity:.25}
.panel .btn{border-color:var(--ink);color:var(--ink)}
.panel .btn.primary{background:var(--ink);color:#FFFFFF}

<script>

  if(s.length>3&&/(oes|ies)$/.test(s))s=s.replace(/ies$/,"y").replace(/oes$/,"o");else if(s.length>3&&/s$/.test(s)&&!/(ss|us|is)$/.test(s))s=s.slice(0,-1);return s}

const LKEY="mise-v1";
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LKEY)||"null");if(d){S.recipes=d.recipes||{};S.plan=d.plan||{days:{}};S.shop=d.shop||{weeks:{}}}}catch(e){}}
let warnedFull=false;
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify({recipes:S.recipes,plan:S.plan,shop:S.shop}))}catch(e){if(!warnedFull&&mode!=="cloud"){warnedFull=true;toast("This browser's storage is full. Sign in to keep more recipes and photos.")}}}
function docFor(id){return id==="plan"?S.plan:id==="shop"?S.shop:S.recipes[id]}
/* Cloud storage: one Supabase table, recipe_docs(user_id, id, data jsonb). Rows are recipes ("r_…"), the meal "plan" and the "shop" list.

function cloud(){return mode==="cloud"&&sb&&user}
function getDirty(){try{return new Set(JSON.parse(localStorage.getItem(DIRTYK)||"[]"))}catch(e){return new Set()}}
function setDirty(set){try{set.size?localStorage.setItem(DIRTYK,JSON.stringify([...set])):localStorage.removeItem(DIRTYK)}catch(e){}}

async function upsertDoc(id){const doc=docFor(id);if(!doc)return deleteDoc(id);
  let photoPending=false;
  if(id.startsWith("r_")&&typeof doc.image==="string"&&doc.image.startsWith("data:")){
    try{const url=await uploadImage(id,doc.image);if(S.recipes[id]===doc&&doc.image.startsWith("data:")){doc.image=url;saveLocal();render()}}
    catch(e){photoPending=true;warnPhoto()}}
  const body=clone(doc);if(photoPending)delete body.image; // never store photo data in the table; retry the upload later
  const{error}=await sb.from(TABLE).upsert({user_id:user.id,id,data:body,updated_at:new Date().toISOString()},{onConflict:"user_id,id"});if(error)throw error;
  if(photoPending)throw{code:"photo_pending"}}
let warnedPhoto=false;function warnPhoto(){if(!warnedPhoto){warnedPhoto=true;toast("Photos can't upload yet. The recipe saved, and the photo will upload once photo storage is set up.")}}
async function deleteDoc(id){const{error}=await sb.from(TABLE).delete().eq("user_id",user.id).eq("id",id);if(error)throw error}
function queue(id,fn){pending++;markDirty(id,true);
  queues[id]=(queues[id]||Promise.resolve()).then(fn).then(()=>markDirty(id,false)).catch(e=>{if(e&&e.code==="photo_pending")return;setSync("offline");toast("Couldn't reach your account. The change is kept here and will sync later.")}).finally(()=>pending--)}

function prunePlan(){const cut=dkey(addDays(new Date(),-70));for(const k in S.plan.days){if(k<cut||!S.plan.days[k].length)delete S.plan.days[k]}
  for(const k in S.shop.weeks)if(k<cut)delete S.shop.weeks[k]}

async function pull(){
  if(!cloud()||syncing||pending)return;syncing=true;setSync("syncing");
  try{
    for(const id of getDirty()){try{if(docFor(id))await upsertDoc(id);else await deleteDoc(id);markDirty(id,false)}catch(e){if(!(e&&e.code==="photo_pending"))throw e}}
    const{data,error}=await sb.from(TABLE).select("id,data");if(error)throw error;
    if(pending)return;
    const remote={};data.forEach(r=>remote[r.id]=r.data);
    if(firstSync){firstSync=false;let owner=null;try{owner=localStorage.getItem(OWNK)}catch(e){}
      if(owner&&owner!==user.id){S.recipes={};S.plan={days:{}};S.shop={weeks:{}}}
      else if(!owner){ // recipes made before signing in move into the account
        const up=[];for(const id in S.recipes)if(!remote[id]){remote[id]=S.recipes[id];up.push(id)}
        if(!remote.plan&&Object.keys(S.plan.days).length){remote.plan=S.plan;up.push("plan")}
        if(!remote.shop&&Object.keys(S.shop.weeks).length){remote.shop=S.shop;up.push("shop")}
        for(const id of up)await upsertDoc(id);if(up.length)toast("Moved "+up.length+" item"+(up.length===1?"":"s")+" from this device into your account")}
      try{localStorage.setItem(OWNK,user.id)}catch(e){}}
    const rec={};for(const id in remote)if(id.startsWith("r_")&&remote[id])rec[id]=remote[id];
    for(const id of getDirty())if(id.startsWith("r_")&&S.recipes[id])rec[id]=S.recipes[id]; // keep local edits that haven't fully synced
    S.recipes=rec;S.plan=remote.plan&&remote.plan.days?remote.plan:{days:{}};S.shop=remote.shop&&remote.shop.weeks?remote.shop:{weeks:{}};
    saveLocal();render();setSync("ok")}
  catch(e){setSync("offline")}
  finally{syncing=false}}

function initCloud(){
  if(!CFG.supabaseUrl||!CFG.supabaseKey){setSync();return}
  if(!window.supabase||!supabase.createClient){setSync("unavailable");return}
  sb=supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey);
  sb.auth.onAuthStateChange((ev,session)=>{const u=session&&session.user||null;
    if((u&&u.id)!==(user&&user.id)){user=u;mode=u?"cloud":"local";firstSync=true;setSync();if(u)setTimeout(pull,0)}
    if(ev==="SIGNED_IN"&&location.hash.includes("access_token"))history.replaceState(null,"",location.pathname)});

  window.addEventListener("online",()=>pull())}

const KEYK="mise-api-key",MODEL="claude-sonnet-5-5";

  limits:async()=>({images:{maxCount:6,mediaTypes:["image/jpeg","image/png","image/webp","image/gif","image/heic"]}}),
  json:async(input,opt={})=>{
    const content=[];for(const f of [...(opt.images||[])])content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:await toJpeg(f)}});

  /* Anthropic fetches the page server-side with its web fetch tool, so the browser's cross-site limits don't apply. */
  fromUrl:async(url,prompt,signal)=>{
    const messages=[{role:"user",content:`Fetch this recipe page with the web_fetch tool: ${url}\n\n${prompt}`}];
    const tools=[{type:"web_fetch_20250910",name:"web_fetch",max_uses:3,max_content_tokens:40000}];
    let all=[];
    for(let round=0;round<4;round++){const r=await apiCall({messages,tools},signal,true);all=all.concat(r.content);
      if(r.stop_reason!=="pause_turn")break;messages.push({role:"assistant",content:r.content})}
    const errs=all.filter(b=>b.type==="web_fetch_tool_result"&&b.content&&b.content.type==="web_fetch_tool_result_error").map(b=>b.content.error_code);

    if(!ok&&errs.length)throw{code:"fetch_"+errs[errs.length-1]};

function ticket(r,i,anim,num){const h=hashOf(r.id),rot=((h%7)-3)*0.45,ga=20+h%140,d=anim?140+i*120:0,sd=anim?d+800:0;

  <span class="print${r.image?" has":""}" style="--ga:${ga}deg" aria-hidden="true">${r.image?`<img src="${esc(r.image)}" alt="" loading="lazy" onerror="this.parentNode.classList.remove('has');this.remove()">`:""}</span>
  <span class="tktitle">${esc(r.title)}</span><span class="dash" aria-hidden="true"></span>

/* Combining: one row per ingredient. Names are cleaned (prep and size words, notes, alternatives dropped),
   singularized and mapped through synonyms; volumes and weights are converted and added up. */
const PREP_RE=/\b(fresh(ly)?|large|medium|small|extra[- ]large|jumbo|chopped|finely|roughly|coarsely|thinly|thickly|diced|minced|sliced|peeled|seeded|deseeded|cubed|halved|quartered|trimmed|rinsed|drained|softened|melted|beaten|lightly|packed|heaping|level|boneless|skinless|organic|ripe|cold|warm|divided|optional|about|approximately|plus more|to taste|for serving|for garnish|at room temperature|room temperature)\b/g;
const SYN={"green onion":"scallion","spring onion":"scallion","garbanzo bean":"chickpea","cilantro leaf":"cilantro","coriander leaf":"cilantro","fresh cilantro":"cilantro","extra virgin olive oil":"olive oil","extra-virgin olive oil":"olive oil","evoo":"olive oil","kosher salt":"salt","sea salt":"salt","table salt":"salt","fine salt":"salt","flaky salt":"salt","pepper":"black pepper","ground black pepper":"black pepper","ground pepper":"black pepper","black peppercorn":"black pepper","garlic clove":"garlic","clove garlic":"garlic","clove of garlic":"garlic","all purpose flour":"flour","all-purpose flour":"flour","ap flour":"flour","plain flour":"flour","granulated sugar":"sugar","white sugar":"sugar","caster sugar":"sugar","unsalted butter":"butter","salted butter":"butter","yellow onion":"onion","white onion":"onion","brown onion":"onion","chicken stock":"chicken broth","vegetable stock":"vegetable broth","beef stock":"beef broth","parmigiano reggiano":"parmesan","parmigiano-reggiano":"parmesan","parmesan cheese":"parmesan","grated parmesan":"parmesan","heavy whipping cream":"heavy cream","whipping cream":"heavy cream","double cream":"heavy cream","scallion onion":"scallion","egg yolk":"egg yolk","lime juice":"lime juice","lemon juice":"lemon juice"};
const PLURAL_UNIT={clove:"cloves",can:"cans",bunch:"bunches",slice:"slices",package:"packages",stick:"sticks",sprig:"sprigs",head:"heads",jar:"jars",pinch:"pinches",dash:"dashes",handful:"handfuls",cup:"cups",pint:"pints",quart:"quarts"};
const VOL={tsp:1,tbsp:3,cup:48,ml:0.2029,l:202.9,pint:96,quart:192},WT={oz:1,lb:16,g:0.035274,kg:35.274};
function singular(w){if(w.length<=3||/(ss|us|is|ous)$/.test(w))return w;if(/oes$/.test(w))return w.slice(0,-2);if(/ies$/.test(w))return w.slice(0,-3)+"y";if(/(ches|shes|xes)$/.test(w))return w.slice(0,-2);if(/s$/.test(w))return w.slice(0,-1);return w}
function cleanIng(g){
  let name=String(g.item||"").toLowerCase(),unit=normUnit(g.unit);
  name=name.replace(/\([^)]*\)/g," ").replace(/\b(or|and\/or)\b.*$/," ").replace(/,.*$/," ").replace(/\bof\b/g," ");
  if(!unit){const m=name.trim().match(/^([a-z]+)\s+(.*)$/);if(m&&UNITS[m[1]]&&!/^(t|c)$/.test(m[1])){unit=UNITS[m[1]];name=m[2]}}
  name=name.replace(PREP_RE," ").replace(/[^a-z\s'-]/g," ").replace(/\s+/g," ").trim();
  if(!unit){const m=name.match(/^(.+?)\s+(cloves?|heads?|bunch(?:es)?|sprigs?|stalks?)$/);if(m){unit=UNITS[m[2]]||singular(m[2]);name=m[1]}}
  const sing=name.split(" ").map(singular).join(" ");
  const canon=SYN[sing]||SYN[name]||sing;
  return{key:canon,display:SYN[sing]||SYN[name]?canon:(name||String(g.item||"").toLowerCase()),unit}}
function splitCombos(g){const n=String(g.item||"").toLowerCase();
  if(/^(salt|kosher salt|sea salt)\s+(and|&)\s+(black\s+)?pepper\b/.test(n))return[{...g,item:"salt"},{...g,item:"black pepper"}];return[g]}
function shoppingItems(ws){
  const items={};
  for(let i=0;i<7;i++){for(const id of S.plan.days[dkey(addDays(ws,i))]||[]){const r=S.recipes[id];if(!r)continue;
    for(const g0 of r.ingredients||[]){if(!g0.item)continue;for(const g of splitCombos(g0)){
      const c=cleanIng(g);if(!c.key)continue;
      const it=items[c.key]||(items[c.key]={key:c.key,item:c.display,section:SECTIONS.includes(g.section)?g.section:/^(can|jar|package)$/.test(c.unit)?"Pantry":guessSection(g.item),vol:0,wt:0,imperial:false,counts:{},loose:false,from:new Set()});
      const q=g.qty!=null&&!isNaN(g.qty)?+g.qty:null;
      if(q==null)it.loose=true;
      else if(VOL[c.unit]){it.vol+=q*VOL[c.unit];if(!/^(ml|l)$/.test(c.unit))it.imperial=true}
      else if(WT[c.unit]){it.wt+=q*WT[c.unit];if(!/^(g|kg)$/.test(c.unit))it.imperial=true}
      else it.counts[c.unit]=(it.counts[c.unit]||0)+q;
      it.from.add(r.title)}}}}
  const out=Object.values(items);out.forEach(it=>it.label=qtyLabel(it));return out}
function qtyLabel(it){const parts=[];
  for(const[u,q]of Object.entries(it.counts))parts.push(fmtQty(q)+(u?" "+(q>1&&PLURAL_UNIT[u]?PLURAL_UNIT[u]:u):""));
  if(it.vol){const t=it.vol;if(!it.imperial){const ml=t/VOL.ml;parts.push(ml>=1000?fmtQty(Math.round(ml/100)/10)+" l":Math.round(ml)+" ml")}
    else if(t>=12)parts.push(fmtQty(Math.round(t/48*8)/8)+(t/48>1.01?" cups":" cup"));else if(t>=3)parts.push(fmtQty(Math.round(t/3*2)/2)+" tbsp");else parts.push(fmtQty(Math.round(t*4)/4)+" tsp")}
  if(it.wt){const oz=it.wt;if(!it.imperial){const g=oz/WT.g;parts.push(g>=1000?fmtQty(Math.round(g/100)/10)+" kg":Math.round(g)+" g")}
    else if(oz>=16)parts.push(fmtQty(Math.round(oz/16*4)/4)+" lb");else parts.push(fmtQty(Math.round(oz*4)/4)+" oz")}
  return parts.join(" + ")+(it.loose&&parts.length?" +":"")}
function visibleItems(ws,w){const cl=w&&w.cleared||{};return shoppingItems(ws).filter(it=>cl[it.key]!==it.label)}
function weekNo(ws){const j=new Date(ws.getFullYear(),0,1);return Math.ceil(((ws-j)/864e5+j.getDay()+1)/7)}
function shopCounts(){const ws=S.week,w=S.shop.weeks[dkey(ws)]||{checked:{},extras:[]},items=visibleItems(ws,w);
  const total=items.length+(w.extras||[]).length,done=items.filter(i=>w.checked[i.key]).length+(w.extras||[]).filter(x=>x.done).length;return{total,done}}
function syncShopCounts(){const c=shopCounts(),f=$("rcount");if(f)f.textContent=`CHECKED ${c.done} / ${c.total}`;
  const rc=$("receipt");if(rc){const st=rc.querySelector(".bigstamp");if(c.total&&c.done===c.total&&!st)rc.insertAdjacentHTML("beforeend",'<div class="bigstamp">ORDER COMPLETE</div>');else if(st&&c.done!==c.total)st.remove()}

function renderShop(){

const PROMPT=`Extract the recipe. Reply with only one JSON object in this shape:
{"title":string,"category":one of ${JSON.stringify(CATS)},"tags":[up to 4 short lowercase tags such as cuisine, main protein, "vegetarian", "quick"],"servings":number|null,"time":string|null (total time like "45 min"),"ingredients":[{"qty":number|null (decimals, e.g. 1.5 for 1 1/2),"unit":string ("" if none; use tsp, tbsp, cup, oz, lb, g, kg, ml, l, clove, can, pinch, bunch, slice, package, stick),"item":string (the ingredient name only, e.g. "yellow onion"),"note":string (prep or detail like "diced", "" if none),"section":one of ${JSON.stringify(SECTIONS)}}],"steps":[string, one per step, short and complete],"notes":string ("" if none)}
Ignore ads, life stories, comments and nutrition panels. If there is no recipe, reply {"error":"short reason"}.`;

/* ---------- free recipe reading: structured data via Supabase, on-device OCR, and a text parser ---------- */
const CAT_RULES=[["Breakfast",/breakfast|brunch|pancake|waffle|oatmeal|oats|granola|omelet|frittata/],["Soup & Stew",/soup|stew|chili|chowder|bisque|ramen|pho/],["Salad",/salad|slaw/],["Dessert",/dessert|cookie|cake|brownie|pie\b|tart|pudding|ice cream|cupcake|fudge|crumble|cobbler/],["Drink",/drink|cocktail|smoothie|beverage|lemonade|latte|punch/],["Baking",/bread|baking|muffin|scone|biscuit|focaccia|loaf|rolls?\b/],["Sauce",/sauce|dressing|condiment|salsa|pesto|gravy|dip\b|marinade/],["Side",/side|vegetable dish/],["Snack",/snack|appetizer|starter|finger food/],["Lunch",/lunch|sandwich|wrap/],["Dinner",/dinner|main|entree|entrée|supper/]];
function mapCat(raw,extra){const s=(raw||"").toLowerCase();for(const[c,re]of CAT_RULES)if(re.test(s))return c;const t=(extra||"").toLowerCase();for(const[c,re]of CAT_RULES)if(c!=="Dinner"&&re.test(t))return c;return raw?raw.replace(/\b\w/g,m=>m.toUpperCase()):""}
function ingObjs(lines){return lines.map(parseLine).filter(Boolean).map(i=>({...i,section:guessSection(i.item)}))}
function fromStructured(r,url){return{title:r.title||"",category:mapCat(r.category,r.title),tags:r.tags||[],servings:r.servings||null,time:r.time||"",ingredients:ingObjs(r.ingredients||[]),steps:r.steps||[],notes:"",source:r.source||url,image:r.image||""}}

function parseRecipeText(raw){
  const lines=String(raw||"").replace(/\r/g,"").split("\n").map(l=>l.replace(/\s+/g," ").trim());
  const head=(re)=>(l)=>l.length<45&&re.test(l.replace(/^[#*\s]+/,""));
  const isIng=head(/^(ingredients?|what you('|’)?ll need|you('|’)?ll need|you will need|shopping list)\b\s*:?/i);
  const isDir=head(/^(directions?|instructions?|method|preparation|steps|how to make( it)?|to make)\b\s*:?/i);
  const isEnd=head(/^(notes?|tips?|cook('|’)?s notes?|nutrition|equipment|video|storage|recipe notes)\b\s*:?/i);
  const iI=lines.findIndex(isIng);if(iI<0)return null;
  const iD=lines.findIndex((l,i)=>i>iI&&isDir(l));
  const endAfter=from=>{const j=lines.findIndex((l,i)=>i>from&&isEnd(l));return j<0?lines.length:j};
  const ingStop=Math.min(iD>0?iD:lines.length,endAfter(iI));
  const ings=[];
  for(let l of lines.slice(iI+1,ingStop)){
    l=l.replace(/^[•\-–*▢□☐○●◯✓✔]\s*/,"");
    if(!l||(/:$/.test(l)&&l.length<40)||/^(scale|us customary|metric|1x|2x|3x|cups?\s*\/\s*grams)\b/i.test(l))continue;
    if(ings.length&&/^[a-z(]/.test(l))ings[ings.length-1]+=" "+l;else ings.push(l)}
  const steps=[];
  if(iD>0){const sl=lines.slice(iD+1,endAfter(iD));
    const NUM=/^(?:step\s*)?(\d{1,2})\s*[.):]\s*(.*)$/i,ONLY=/^(?:step\s*)?\d{1,2}[.):]?$/i;
    const numbered=sl.filter(l=>NUM.test(l)||ONLY.test(l)).length>=2;let cur="";const push=()=>{if(cur.trim())steps.push(cur.trim());cur=""};
    for(const l of sl){
      if(numbered){if(ONLY.test(l)){push();continue}const m=l.match(NUM);if(m){push();cur=m[2];continue}if(l)cur+=(cur?" ":"")+l}
      else{if(!l){push();continue}if(cur&&/[.!?)]$/.test(cur)&&/^[A-Z]/.test(l)){push()}cur+=(cur?" ":"")+l}}
    push()}
  const notesAt=lines.findIndex((l,i)=>i>Math.max(iI,iD)&&isEnd(l)&&/^notes?|tips?|cook/i.test(l));
  const notes=notesAt>0?lines.slice(notesAt+1).filter(Boolean).join(" ").slice(0,600):"";
  const skip=/^(jump to|print|pin|save|rate|share|home|menu|search|recipes?$|\d+(\.\d+)?\s*(stars?|reviews?|ratings?)|by\s)/i;
  const title=(lines.slice(0,iI).find(l=>l.length>=3&&l.length<=90&&!skip.test(l)&&!/^\d+$/.test(l)&&!/^(prep|cook|total|serves|servings|yield)\b/i.test(l))||"").replace(/[#*]/g,"").trim();
  const all=lines.join("\n");
  const sv=all.match(/\b(?:serves|servings|yield|makes)\b\s*:?\s*(\d+)/i);
  const tm=all.match(/\btotal(?:\s*time)?\s*:?\s*((?:\d+\s*(?:hours?|hrs?|h)\b\s*)?(?:\d+\s*(?:minutes?|mins?|m)\b)?)/i);
  const ingredients=ingObjs(ings);if(!ingredients.length)return null;
  return{title,category:mapCat("",title),tags:[],servings:sv?+sv[1]:null,time:tm&&tm[1].trim()?tm[1].trim().replace(/hours?|hrs?/i,"hr").replace(/minutes?|mins?/i,"min"):"",ingredients,steps,notes}}

let tessP=null;
function loadTess(){return tessP||(tessP=new Promise((ok,bad)=>{if(window.Tesseract)return ok(window.Tesseract);const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";s.onload=()=>window.Tesseract?ok(window.Tesseract):bad({code:"ocr_failed"});s.onerror=()=>{tessP=null;bad({code:"ocr_failed"})};document.head.append(s)}))}
async function ocr(files,signal,onProg){const T=await loadTess();let cur=0;
  let worker;try{worker=await T.createWorker("eng",1,{logger:m=>{if(m.status==="recognizing text")onProg((cur+m.progress)/files.length)}})}catch(e){throw{code:"ocr_failed"}}
  try{const out=[];for(cur=0;cur<files.length;cur++){if(signal.aborted)throw{code:"cancelled"};const{data}=await worker.recognize(files[cur]);out.push(data.text)}return out.join("\n")}
  finally{worker.terminate().catch(()=>{})}}

async function claudeExtract(input,opts,signal){const out=await apiSample.json(input,{...opts,signal});if(!out||typeof out!=="object"||out.error||!out.title)throw{code:"claude_no_recipe",detail:out&&out.error};return out}
async function importFromUrl(url,signal,say){
  let free="signed_out";
  if(cloud()){say("Opening the page…");
    try{const{data,error}=await sb.functions.invoke("recipe-from-url",{body:{url}});
      if(error){const st=error.context&&error.context.status;free=error.name==="FunctionsFetchError"?"fn_unreachable":st===404?"fn_missing":st===401?"signed_out":"failed"}
      else if(data&&data.recipe&&data.recipe.ingredients&&data.recipe.ingredients.length)return{recipe:fromStructured(data.recipe,url),via:"free",imageData:data.imageData||null};
      else free=(data&&data.error)||"no_recipe_data"}
    catch(e){free="failed"}}
  if(signal.aborted)throw{code:"cancelled"};
  if(apiKey()&&free!=="bad_url"){say("Asking Claude to read the page. This usually takes 20–60 seconds.");return{recipe:{...await apiSample.fromUrl(url,PROMPT,signal).then(o=>{if(!o||o.error||!o.title)throw{code:"claude_no_recipe",detail:o&&o.error};return o}),source:url},via:"claude"}}
  throw{code:"free_"+free}}
async function importFromShots(files,signal,say){
  let text="";
  try{say("Getting text recognition ready…");text=await ocr(files,signal,p=>say("Reading text from "+(files.length>1?"your screenshots":"the screenshot")+"… "+Math.round(p*100)+"%"))}
  catch(e){if(e&&e.code==="cancelled")throw e;if(!apiKey())throw e}
  const r=text&&parseRecipeText(text);if(r)return{recipe:r,via:"free"};
  if(signal.aborted)throw{code:"cancelled"};
  if(apiKey()){say("Asking Claude to read the screenshots. This usually takes 20–60 seconds.");return{recipe:await claudeExtract(PROMPT+"\n\nThe recipe is in the attached screenshot(s), shown in order.",{images:files},signal),via:"claude"}}
  throw{code:"free_no_recipe_shot"}}
async function importFromText(text,url,signal,say){
  const r=parseRecipeText(text);if(r)return{recipe:{...r,source:url},via:"free"};
  if(apiKey()){say("Asking Claude to read the recipe. This usually takes 20–60 seconds.");return{recipe:{...await claudeExtract(PROMPT+"\n\nRecipe text:\n"+text.slice(0,40000),{},signal),source:url},via:"claude"}}
  throw{code:"free_no_recipe_text"}}

// Pull in a photo for recipes imported from a web page. The server downloads it (many sites block
// hotlinking), and it's resized and kept with the recipe, uploaded to your photo storage when signed in.
async function attachPhoto(rec,imageData,say){
  try{const src=rec.source||"";
    if(!imageData&&!rec.image&&cloud()&&/^https?:\/\//i.test(src)){
      say("Looking for a photo…");
      const{data,error}=await sb.functions.invoke("recipe-from-url",{body:{url:src,imageOnly:true}});
      if(!error&&data){imageData=data.imageData||null;if(!rec.image&&data.image)rec.image=data.image}}
    if(imageData){const blob=await(await fetch(imageData)).blob();rec.image=await resizeImage(blob,cloud()?1400:900,cloud()?.82:.72)}
  }catch(e){/* keep the link, or no photo */}}
async function runImport(kind,p){
  const rb=$("readBtn");importCtl=new AbortController();const ctl=importCtl;
  const say=msg=>{const st=$("impStatus");if(st&&importCtl===ctl)st.innerHTML=`<div class="status"><span class="mini" aria-hidden="true"></span><span>${esc(msg)}</span><button class="btn ghost" data-act="stopImport">Stop</button></div>`};
  if(rb)rb.disabled=true;say("Working…");
  try{const res=kind==="web"?await importFromUrl(p.url,ctl.signal,say):kind==="shot"?await importFromShots(p.files,ctl.signal,say):await importFromText(p.text,p.url,ctl.signal,say);
    if(ctl.signal.aborted)return;const rec={...res.recipe,via:res.via};await attachPhoto(rec,res.imageData,say);
    if(ctl.signal.aborted)return;shotFiles=[];openEdit(null,rec)}
  catch(e){const st=$("impStatus");if(!st)return;const c=e&&e.code;
    const msg=c==="cancelled"?"":c==="claude_no_recipe"?(e.detail?"No recipe found: "+e.detail:"Couldn't find a recipe in that."):IMPORT_ERR[c]||(String(c||"").startsWith("fetch_")?"The page couldn't be read. Try a screenshot or pasted text.":"Something went wrong reading the recipe. Try again.");
    st.innerHTML=msg?`<p class="err">${esc(msg)}</p>`:"";const b2=$("readBtn");if(b2)b2.disabled=false}
  finally{if(importCtl===ctl)importCtl=null}}

const BUCKET="recipe-images";let editImage="";
function resizeImage(file,max,q){return new Promise((ok,bad)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);ok(c.toDataURL("image/jpeg",q))};img.onerror=()=>bad(new Error("bad image"));img.src=URL.createObjectURL(file)})}
async function uploadImage(id,dataUrl){const blob=await (await fetch(dataUrl)).blob();const path=`${user.id}/${id}-${Date.now().toString(36)}.jpg`;
  const{error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:"image/jpeg",cacheControl:"31536000",upsert:false});if(error)throw error;
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl}
function ownStoragePath(url){if(!sb||!user||typeof url!=="string")return null;const m=url.match(new RegExp("/storage/v1/object/public/"+BUCKET+"/(.+)$"));return m&&m[1].startsWith(user.id+"/")?decodeURIComponent(m[1]):null}
function deleteImage(url){const p=ownStoragePath(url);if(p)sb.storage.from(BUCKET).remove([p]).catch(()=>{})}
function photoHTML(r,cls){const c=catColor(r.category);const initial=esc((r.title||"?").trim().charAt(0).toUpperCase());

function drawPhotoField(){const el=$("photoField");if(!el)return;
  el.innerHTML=`<div class="photoprev">${editImage?`<img src="${esc(editImage)}" alt="Recipe photo" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'hint',textContent:'This image link could not be loaded.'}))">`:`<span class="hint">No photo yet</span>`}</div>
  <div class="row"><label class="btn" for="photoIn">${editImage?"Change photo":"Add photo"}</label><input type="file" id="photoIn" accept="image/*" hidden><button class="btn ghost" type="button" data-act="photoLink">Use image link</button>${editImage?'<button class="btn ghost danger" type="button" data-act="photoRemove">Remove</button>':""}</div>

function cookSave(){if(!cook)return;try{localStorage.setItem(COOKK+cook.id,JSON.stringify({s:[...cook.steps],i:[...cook.ings],t:Date.now()}))}catch(e){}}
function cookClear(id){try{localStorage.removeItem(COOKK+id)}catch(e){}}
async function keepAwake(on){try{if(on&&"wakeLock" in navigator&&document.visibilityState==="visible"){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>{wakeLock=null;const n=$("awakeNote");if(n)n.textContent=""})}else if(!on&&wakeLock){await wakeLock.release();wakeLock=null}}catch(e){wakeLock=null}const n=$("awakeNote");if(n)n.textContent=wakeLock?"Screen stays on":""}
document.addEventListener("visibilitychange",()=>{if(cook&&document.visibilityState==="visible"&&!wakeLock)keepAwake(true)});
const TIME_RE=/(\d+(?:\.\d+)?|an?|one)(?:\s*(?:-|–|to)\s*(\d+(?:\.\d+)?))?\s*(hours?|hrs?|minutes?|mins?|seconds?|secs?)\b/gi;
function stepTimes(text){const out=[];text=text.replace(/(\d+|an?|one)\s*(?:hours?|hrs?)\s*(?:and\s*)?(\d+)\s*(?:minutes?|mins?)\b/gi,(all,h,mn)=>{const hh=/^\d+$/.test(h)?+h:1,sec=hh*3600+(+mn)*60;if(sec<=12*3600)out.push({sec,label:hh+" hr "+mn+" min"});return " "});for(const m of text.matchAll(TIME_RE)){const n=/^(an?|one)$/i.test(m[1])?1:parseFloat(m[1]);if(!n)continue;const u=m[3].toLowerCase();const mult=u.startsWith("h")?3600:u.startsWith("s")?1:60;const sec=Math.round(n*mult);if(sec<10||sec>12*3600)continue;
  const label=(m[2]?m[1]+"–"+m[2]:/^(an?|one)$/i.test(m[1])?"1":m[1])+" "+(mult===3600?"hr":mult===1?"sec":"min");if(!out.some(o=>o.sec===sec))out.push({sec,label})}return out.slice(0,3)}
function openCook(id){const r=S.recipes[id];if(!r)return;cook={id,...cookLoad(id)};
  let el=$("cook");if(!el){el=document.createElement("div");el.id="cook";el.className="cook";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");document.body.append(el)}
  el.hidden=false;document.body.classList.add("cooking");drawCook();keepAwake(true)}
function redrawCook(scroll){const d=$("cookIngs"),op=d?d.open:null;drawCook(scroll);const n=$("cookIngs");if(n&&op!==null)n.open=op}
function closeCook(){$("cook").hidden=true;document.body.classList.remove("cooking");keepAwake(false);cook=null}
let justDone=-1;
function drawCook(scrollToCurrent){const r=S.recipes[cook.id];if(!r)return closeCook();const el=$("cook");
  const steps=r.steps||[],ings=r.ingredients||[];const done=cook.steps.size,cur=steps.findIndex((s,i)=>!cook.steps.has(i));
  const jd=justDone;justDone=-1;
  el.innerHTML=`<div class="in"><div class="cookbar"><div class="top1"><h2>${esc(r.title)}</h2><button class="btn" data-act="cookClose">Done</button></div>
    <div class="cookmeta"><b id="cookStat">${cookStat(steps.length,cur)}</b><span id="awakeNote">${wakeLock?"Screen stays on":""}</span></div>
    <div class="progress" id="cookProg" role="progressbar" aria-valuemin="0" aria-valuemax="${steps.length}" aria-valuenow="${done}">${steps.map((s,i)=>`<i class="${cook.steps.has(i)?"on":""}"></i>`).join("")}</div></div>
  ${ings.length?`<details ${done?"":"open"} id="cookIngs"><summary>Mise <small id="cookIngN">${cook.ings.size} of ${ings.length} ready${scale!==1?" · ×"+esc(fmtQty(scale)):""}</small></summary>
    ${ings.map((i,ix)=>`<label class="cing${cook.ings.has(ix)?" done":""}"><input type="checkbox" data-act="cookIng" data-ix="${ix}" ${cook.ings.has(ix)?"checked":""}><span class="q">${esc([fmtQty(i.qty!=null?i.qty*scale:null),i.unit].filter(Boolean).join(" "))}</span><span>${esc(i.item)}${i.note?` <span style="color:var(--muted)">${esc(i.note)}</span>`:""}</span></label>`).join("")}</details>`:""}
  <div class="csteps">${steps.map((s,ix)=>{const d=cook.steps.has(ix),times=stepTimes(s);
    return`<div class="cstep${d?" done":""}${ix===cur?" current":""}${ix===jd?" justdone":""}" id="cs${ix}"><span class="fired" aria-hidden="true">FIRED</span><button class="ccheck" data-act="cookStep" data-ix="${ix}" aria-pressed="${d}" aria-label="${d?"Mark step "+(ix+1)+" not done":"Mark step "+(ix+1)+" done"}">${d?"✓":ix+1}</button>
      <div><div class="ctext" data-act="cookStep" data-ix="${ix}">${esc(s)}</div>${times.length?`<div class="ctimers">${times.map(t=>`<button class="tbtn" data-act="timer" data-sec="${t.sec}" data-label="${esc("Step "+(ix+1)+" · "+t.label)}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>${esc(t.label)}</button>`).join("")}</div>`:""}</div></div>`}).join("")}</div>
  <div id="cookFoot">${cookFootHtml(steps.length,cur,done)}</div></div>`;
  if(scrollToCurrent)cookScrollToNext(cur)}
const cookStat=(n,cur)=>n?(cur<0?"ALL FIRED":"ON FIRE · STEP "+(cur+1)+" OF "+n):"NO STEPS YET";
function cookFootHtml(n,cur,done){return n&&cur<0?`<div class="finish"><h3>Order up!</h3><p style="margin:0;font-size:12px;letter-spacing:.06em;color:#AEB4BA">Your checkmarks clear when you finish.</p><div class="row"><button class="btn fire" data-act="cookFinish">Finish cooking</button><button class="btn" data-act="cookReset">Start over</button></div></div>`:
  done||cook.ings.size?`<div style="margin-top:18px"><button class="btn" data-act="cookReset" style="border-color:#AEB4BA;color:#FFFFFF">Clear checkmarks</button></div>`:""}
// Update checkmarks in place (no re-render), so nothing on the page shifts or collapses.
function patchCook(){const r=S.recipes[cook.id];if(!r)return closeCook();const steps=r.steps||[],ings=r.ingredients||[];
  const done=cook.steps.size,cur=steps.findIndex((s,i)=>!cook.steps.has(i));
  const st=$("cookStat");if(st)st.textContent=cookStat(steps.length,cur);
  const pg=$("cookProg");if(pg){pg.setAttribute("aria-valuenow",done);[...pg.children].forEach((b,i)=>b.classList.toggle("on",cook.steps.has(i)))}
  steps.forEach((s,ix)=>{const el=$("cs"+ix);if(!el)return;const d=cook.steps.has(ix);el.classList.toggle("done",d);el.classList.toggle("current",ix===cur);
    el.classList.remove("justdone");if(ix===justDone){void el.offsetWidth;el.classList.add("justdone")}
    const b=el.querySelector(".ccheck");if(b){b.textContent=d?"✓":ix+1;b.setAttribute("aria-pressed",d);b.setAttribute("aria-label",(d?"Mark step "+(ix+1)+" not done":"Mark step "+(ix+1)+" done"))}});
  justDone=-1;
  const n=$("cookIngN");if(n)n.textContent=`${cook.ings.size} of ${ings.length} ready${scale!==1?" · ×"+fmtQty(scale):""}`;
  document.querySelectorAll("#cook .cing").forEach((l,ix)=>l.classList.toggle("done",cook.ings.has(ix)));
  const f=$("cookFoot");if(f){const h=cookFootHtml(steps.length,cur,done);if(f.innerHTML!==h)f.innerHTML=h}
  return cur}
// Bring the next step to the top of the screen, just under the sticky header.
function cookScrollToNext(cur){const box=$("cook");if(!box)return;const el=cur>=0?$("cs"+cur):$("cookFoot");if(!el)return;
  const bar=box.querySelector(".cookbar"),barH=bar?bar.getBoundingClientRect().height:0;
  const top=box.scrollTop+el.getBoundingClientRect().top-box.getBoundingClientRect().top-barH-14;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  box.scrollTo({top:Math.max(0,top),behavior:reduce?"auto":"smooth"})}

/* timers keep running when cooking mode is closed; they show in a bar above the tabs */
let timers=[],tick=null,actx=null;
function startTimer(sec,label){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}
  timers.push({id:Math.random().toString(36).slice(2),label,end:Date.now()+sec*1000,ring:false});drawTimers();if(!tick)tick=setInterval(drawTimers,1000);toast("Timer started")}
function beep(){try{if(!actx)return;const t0=actx.currentTime;for(let k=0;k<3;k++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,t0+k*.35);g.gain.exponentialRampToValueAtTime(.3,t0+k*.35+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+k*.35+.28);o.connect(g).connect(actx.destination);o.start(t0+k*.35);o.stop(t0+k*.35+.3)}}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
function drawTimers(){let bar=$("timerbar");if(!bar){bar=document.createElement("div");bar.id="timerbar";bar.className="timerbar";bar.setAttribute("aria-live","polite");document.body.append(bar)}
  const now=Date.now();for(const t of timers)if(!t.ring&&t.end<=now){t.ring=true;t.rang=now;beep();toast(t.label+" is done")}
  for(const t of timers)if(t.ring&&now-t.rang>=10000&&now-t.rang<11000)beep();
  bar.innerHTML=timers.map(t=>{const left=Math.max(0,Math.ceil((t.end-now)/1000)),h=Math.floor(left/3600),m=Math.floor(left%3600/60),s=left%60;
    const adj=t.adj?`<div class="adj">${[[-3600,"−1h"],[-60,"−1m"],[60,"+1m"],[3600,"+1h"]].map(([d,l])=>`<button data-act="timerAdj" data-tid="${t.id}" data-d="${d}" class="${d>0?"up":""}" aria-label="${d>0?"Add":"Take off"} ${Math.abs(d)>=3600?"1 hour":"1 minute"}">${l}</button>`).join("")}</div>`:"";
    return`<div class="timer${t.ring?" ring":""}"><span>${esc(t.label)}</span><b>${t.ring?"Done":(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0")}</b><button class="pm" data-act="timerPm" data-tid="${t.id}" aria-expanded="${!!t.adj}" aria-label="Adjust timer">±</button><button data-act="timerStop" data-tid="${t.id}" aria-label="${t.ring?"Dismiss":"Cancel"} timer">×</button>${adj}</div>`}).join("");
  bar.hidden=!timers.length;if(!timers.length&&tick){clearInterval(tick);tick=null}}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-tab]");if(!t)return;
  if(t.dataset.tab&&!t.dataset.act){if($("sheet").hidden===false)closeSheet();setView(t.dataset.tab);return}
  const a=t.dataset.act;
  if(a==="add"){openAdd()}
  else if(a==="close"){closeSheet()}
  else if(a==="settings"){openSettings()}
  else if(a==="photoRemove"){editImage="";drawPhotoField()}
  else if(a==="photoLink"){const r2=$("photoLinkRow");r2.hidden=!r2.hidden;if(!r2.hidden)$("photoUrl").focus()}
  else if(a==="photoLinkSet"){const u=$("photoUrl").value.trim();if(!/^https?:\/\//i.test(u)){toast("Paste a link that starts with https://");return}editImage=u;drawPhotoField()}
  else if(a==="cookStart"){openCook(openId)}
  else if(a==="cookClose"){closeCook()}
  else if(a==="cookStep"){const ix=+t.dataset.ix;const was=cook.steps.has(ix);was?cook.steps.delete(ix):cook.steps.add(ix);if(!was)justDone=ix;cookSave();const cur=patchCook();if(!was)cookScrollToNext(cur)}
  else if(a==="cookReset"){cook.steps.clear();cook.ings.clear();cookClear(cook.id);drawCook();$("cook").scrollTo(0,0)}
  else if(a==="cookFinish"){cookClear(cook.id);closeCook();toast("Nice work!")}
  else if(a==="timer"){startTimer(+t.dataset.sec,t.dataset.label)}
  else if(a==="timerStop"){timers=timers.filter(x=>x.id!==t.dataset.tid);drawTimers()}
  else if(a==="timerPm"){const tm=timers.find(x=>x.id===t.dataset.tid);if(tm){tm.adj=!tm.adj;drawTimers()}}
  else if(a==="timerAdj"){const tm=timers.find(x=>x.id===t.dataset.tid);if(!tm)return;const d=+t.dataset.d*1000,now=Date.now();
    // adding time to a finished timer restarts it from now; taking time off never goes below zero
    tm.end=(tm.ring&&d>0)?now+d:Math.max(now,tm.end+d);if(tm.end>now){tm.ring=false;delete tm.rang}
    if(!tick)tick=setInterval(drawTimers,1000);drawTimers()}
  else if(a==="fav"){const id=t.dataset.id,was=!!(S.recipes[id]&&S.recipes[id].fav);popId=id;if(!was)stampId=id;toggleFav(id);if(!$("sheet").hidden&&openId===id&&$("delBtn")){const sc=$("panel").scrollTop;drawDetail();$("panel").scrollTop=sc}}
  else if(a==="fireIt"){const pn=$("panel");pn.querySelectorAll(".bigstamp").forEach(x=>x.remove());const d=new Date();let h=d.getHours()%12||12;const tm=h+":"+String(d.getMinutes()).padStart(2,"0")+(d.getHours()>=12?"P":"A");pn.insertAdjacentHTML("beforeend",`<div class="bigstamp" style="position:fixed;top:45%">FIRED · ${tm}</div>`);const id=openId;setTimeout(()=>{closeSheet();openCook(id)},matchMedia("(prefers-reduced-motion: reduce)").matches?0:750)}
  else if(a==="syncNow"){pull().then(()=>toast(syncState==="offline"?"Couldn't reach your account":"Synced"))}
  else if(a==="signOut"){if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Tap again to sign out";return}signOut()}
  else if(a==="forgetKey"){try{localStorage.removeItem(KEYK)}catch(x){}closeSheet();toast("API key removed")}
  else if(a==="examples"){loadExamples()}
  else if(a==="cat"){S.cat=t.dataset.cat;animRail=true;renderRecipes()}
  else if(a==="open"){openDetail(t.dataset.id)}
  else if(a==="week"){const d=+t.dataset.d;S.week=d?addDays(S.week,d):sow(new Date());animDays=true;animShop=true;render()}
  else if(a==="planAdd"){openPicker(t.dataset.date)}
  else if(a==="pickRecipe"){(S.plan.days[pickDate]||(S.plan.days[pickDate]=[])).push(t.dataset.id);persist("plan");closeSheet();render();toast("Added to plan")}
  else if(a==="unplan"){const arr=S.plan.days[t.dataset.date]||[];arr.splice(+t.dataset.ix,1);persist("plan");render()}
  else if(a==="toPlan"){openDayPicker()}
  else if(a==="pickDay"){const k=t.dataset.date;(S.plan.days[k]||(S.plan.days[k]=[])).push(openId);persist("plan");const d=new Date(k+"T12:00");S.week=sow(d);closeSheet();render();toast("Added to "+DOW[d.getDay()]+" "+MON[d.getMonth()]+" "+d.getDate())}
  else if(a==="edit"){openEdit(openId)}
  else if(a==="del"){if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Sure?";setTimeout(()=>{if(t.isConnected){t.classList.remove("armed");t.textContent="86"}},3000);return}
    const id=openId;if(S.recipes[id])deleteImage(S.recipes[id].image);delete S.recipes[id];let changed=false;for(const k in S.plan.days){const n=S.plan.days[k].filter(x=>x!==id);if(n.length!==S.plan.days[k].length){S.plan.days[k]=n;changed=true}}
    remove(id);if(changed)persist("plan");closeSheet();render();toast("86'd · ticket removed")}
  else if(a==="scale"){scale=Math.max(.5,scale+(+t.dataset.d)*(S.recipes[openId]?.servings?1/S.recipes[openId].servings*2:1));scale=Math.round(scale*100)/100;scaleFlip=true;const sc=$("panel").scrollTop;drawDetail();$("panel").scrollTop=sc}
  else if(a==="mode"){importMode=t.dataset.m;drawAdd()}
  else if(a==="blank"){openEdit(null,null)}
  else if(a==="readShot"){if(shotFiles.length)runImport("shot",{files:shotFiles})}
  else if(a==="readText"){const txt=$("textIn").value.trim(),url=$("linkIn").value.trim();if(!txt){$("impStatus").innerHTML=`<p class="err">Paste the recipe text first. To import straight from a link, use the Website tab.</p>`;return}runImport("text",{text:txt,url})}
  else if(a==="stopImport"){if(importCtl)importCtl.abort()}
  else if(a==="extraDel"){const w=shopWeek();w.extras.splice(+t.dataset.ix,1);persist("shop");renderShop();renderBadge()}
  else if(a==="clearChecked"){const w=shopWeek(),items=visibleItems(S.week,w);let n=0;items.forEach(i=>{if(w.checked[i.key])n++});const ex=w.extras.filter(x=>x.done).length;
    w.checked={};w.extras=w.extras.filter(x=>!x.done);persist("shop");render();toast(n+ex?"Cleared "+(n+ex)+" checked item"+(n+ex===1?"":"s"):"Nothing was checked")}
  else if(a==="clearAll"){if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Tap again to clear";setTimeout(()=>{if(t.isConnected){t.classList.remove("armed");t.textContent="Clear list"}},3000);return}
    t.classList.remove("armed");t.textContent="Clear list";const doClear=()=>{const w=shopWeek(),cl={};shoppingItems(S.week).forEach(i=>cl[i.key]=i.label);w.cleared=cl;w.checked={};w.extras=[];persist("shop");render();toast("Order torn off the spike")};
    const rw=$("rwrap");if(rw&&!matchMedia("(prefers-reduced-motion: reduce)").matches){rw.classList.remove("feed");rw.classList.add("tearing");setTimeout(doClear,880)}else doClear()}
  else if(a==="restoreList"){const w=shopWeek();delete w.cleared;persist("shop");animShop=true;render()}
  else if(a==="copy"){const w=S.shop.weeks[dkey(S.week)]||{checked:{},extras:[]},items=visibleItems(S.week,w).filter(i=>!w.checked[i.key]);
    const by={};items.forEach(i=>(by[i.section]||(by[i.section]=[])).push(i));let txt="Shopping list · "+weekLabel(S.week)+"\n";
    SECTIONS.forEach(s=>{if(by[s]){txt+="\n"+s+"\n"+by[s].map(i=>"• "+i.item+(i.label?" ("+i.label+")":"")).join("\n")+"\n"}});
    const ex=(w.extras||[]).filter(x=>!x.done);if(ex.length)txt+="\nAlso buy\n"+ex.map(x=>"• "+x.text).join("\n")+"\n";
    navigator.clipboard.writeText(txt).then(()=>toast("List copied")).catch(()=>{openSheet(`<div class="phead"><h2>Copy your list</h2>${closeBtn}</div><textarea class="field" id="copyBox" rows="14" readonly>${esc(txt)}</textarea>`);const b=$("copyBox");b.focus();b.select()})}
});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.act==="cookIng"&&cook){const ix=+t.dataset.ix;t.checked?cook.ings.add(ix):cook.ings.delete(ix);cookSave();patchCook();return}
  if(t.dataset.act==="check"){const w=shopWeek();if(t.checked)w.checked[t.dataset.key]=1;else delete w.checked[t.dataset.key];persist("shop");t.closest(".item").classList.toggle("done",t.checked);syncShopCounts()}
  else if(t.dataset.act==="extra"){const w=shopWeek();w.extras[+t.dataset.ix].done=t.checked;persist("shop");t.closest(".item").classList.toggle("done",t.checked);syncShopCounts()}});
$("q").addEventListener("input",e=>{S.q=e.target.value;renderRecipes()});
$("extraForm").addEventListener("submit",e=>{e.preventDefault();const v=$("extraIn").value.trim();if(!v)return;const w=shopWeek();w.extras.push({text:v,done:false});$("extraIn").value="";persist("shop");renderShop();renderBadge();updateLed()});
let rzT=null;window.addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(S.view==="recipes"&&railCols()!==lastCols)renderRecipes()},150)});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(cook){closeCook();return}if(!$("sheet").hidden)closeSheet()});

loadLocal();animRail=true;render();initCloud();setSync();
</script>
