<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Recipe Book</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2b2622;--mut:#7a6f66;--ac:#c4552d;--bd:#e8e0d5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--card:#292422;--tx:#f1ebe4;--mut:#a69b90;--ac:#e8734a;--bd:#3a332e}}
:root[data-theme="dark"]{--bg:#1c1917;--card:#292422;--tx:#f1ebe4;--mut:#a69b90;--ac:#e8734a;--bd:#3a332e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font:700 26px Georgia,serif;margin:4px 0 14px}h2{font:600 17px Georgia,serif;margin:18px 0 8px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);margin:4px 0 10px}
textarea{min-height:110px;resize:vertical}
button{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.g{border:0;background:none;color:var(--ac);padding:4px 8px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.f{flex:0 0 auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.chips button{flex:0 0 auto;border-radius:99px;padding:6px 14px;font-size:14px}
.chips .on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:8px 0}
.rc{cursor:pointer}.rc b{display:block}.tag{font-size:12px;color:var(--mut)}
.day{display:flex;justify-content:space-between;align-items:center}.day b{font:600 16px Georgia,serif}
.pl{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-top:1px solid var(--bd);margin-top:6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 4px;color:var(--mut);font-size:14px}nav .on{color:var(--ac);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);overflow-y:auto;z-index:20}
.sheet{background:var(--bg);max-width:640px;margin:0 auto;min-height:100%;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 40px}
.ck{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.ck input{width:22px;height:22px;margin:0;flex:0 0 auto}
.ck.d span{text-decoration:line-through;color:var(--mut)}
ol,ul{padding-left:20px}li{margin:6px 0}
.imp{border:1px dashed var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;display:none}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
</style></head><body>
<main id="app"></main>
<nav><button data-t="r">Recipes</button><button data-t="p">Planner</button><button data-t="s">Shopping</button></nav>
<div id="toast"></div><div id="ov" class="ov" hidden></div>
<script>
const CATS=['Breakfast','Lunch','Dinner','Dessert','Snack','Drinks','Other'];
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
let S={recipes:[],plan:{},checked:{}},tab='r',cat='All',q='';
try{const x=JSON.parse(localStorage.getItem('rb')||'null');if(x)S=Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem('rb',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)}
const num=s=>{if(!s)return null;s=s.trim();let m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/);if(m)return +m[1]+m[2]/m[3];m=s.match(/^(\d+)\/(\d+)$/);return m?m[1]/m[2]:parseFloat(s)};
const fmt=n=>n==null?'':String(Math.round(n*100)/100);
function parseIng(l){l=l.trim();const m=l.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.?\d+)?\s*(cups?|tbsps?|tsps?|tablespoons?|teaspoons?|kg|g|ml|l|oz|lbs?|pounds?|cloves?|cans?|pinch|slices?)?\b\s*(.*)$/i);
 let q=num(m[1]),u=(m[2]||'').toLowerCase().replace(/s$/,''),n=m[3]||'';if(!n){n=l;q=null;u=''}
 u={tablespoon:'tbsp',teaspoon:'tsp',pound:'lb'}[u]||u;return{q,u,n:n.trim()}}
const recipeIngs=r=>(r.ingredients||'').split('\n').filter(x=>x.trim()).map(parseIng);
const cats=()=>['All',...new Set([...CATS,...S.recipes.map(r=>r.category).filter(Boolean)])];

function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 $('#app').innerHTML=tab==='r'?vR():tab==='p'?vP():vS();
}
function vR(){
 const list=S.recipes.filter(r=>(cat==='All'||r.category===cat)&&(!q||(r.title+r.ingredients).toLowerCase().includes(q.toLowerCase())));
 return `<h1>Recipe Book</h1><div class="row"><input id="q" placeholder="Search recipes or ingredients" value="${esc(q)}" oninput="q=this.value;keepFocus()"><button class="p f" onclick="edit()">+ Add</button></div>
 <div class="chips">${cats().map(c=>`<button class="${c===cat?'on':''}" onclick="cat='${esc(c)}';render()">${esc(c)}</button>`).join('')}</div>
 ${list.length?list.map(r=>`<div class="card rc" onclick="view('${r.id}')"><b>${esc(r.title)}</b><span class="tag">${esc(r.category||'Uncategorized')} · ${recipeIngs(r).length} ingredients</span></div>`).join(''):`<div class="empty">${S.recipes.length?'No matches.':'No recipes yet. Tap “+ Add” to import a screenshot, paste a recipe, or type one in.'}</div>`}`}
function keepFocus(){const p=$('#q').selectionStart;render();const e=$('#q');e.focus();e.setSelectionRange(p,p)}
function vP(){return `<h1>Weekly Planner</h1>${DAYS.map(d=>{const ids=S.plan[d]||[];return `<div class="card"><div class="day"><b>${d}</b></div>
 ${ids.map((id,i)=>{const r=S.recipes.find(x=>x.id===id);return r?`<div class="pl"><span>${esc(r.title)}</span><button class="g" onclick="unplan('${d}',${i})">Remove</button></div>`:''}).join('')}
 <select onchange="plan('${d}',this.value)"><option value="">+ Add a recipe…</option>${S.recipes.map(r=>`<option value="${r.id}">${esc(r.title)}</option>`).join('')}</select></div>`}).join('')}
 ${S.recipes.length?'':'<div class="empty">Add some recipes first.</div>'}`}
function plan(d,id){if(!id)return;(S.plan[d]=S.plan[d]||[]).push(id);S.checked={};save();render()}
function unplan(d,i){S.plan[d].splice(i,1);save();render()}
function shopItems(){const m={};
 Object.values(S.plan).flat().forEach(id=>{const r=S.recipes.find(x=>x.id===id);if(!r)return;
  recipeIngs(r).forEach(g=>{const k=g.n.toLowerCase().replace(/s$/,'')+'|'+g.u;const e=m[k]=m[k]||{k,n:g.n,u:g.u,q:0,any:false,c:0};e.c++;if(g.q!=null){e.q+=g.q;e.any=true}})});
 return Object.values(m).sort((a,b)=>a.n.localeCompare(b.n))}
function vS(){const it=shopItems();
 return `<h1>Shopping List</h1>${it.length?`<div class="row" style="margin-bottom:6px"><span class="tag">${it.filter(i=>S.checked[i.k]).length} of ${it.length} checked</span><button class="g f" onclick="S.checked={};save();render()">Uncheck all</button></div>`+it.map(i=>`<label class="ck ${S.checked[i.k]?'d':''}"><input type="checkbox" ${S.checked[i.k]?'checked':''} onchange="S.checked['${esc(i.k).replace(/'/g,'')}']=this.checked;save();render()"><span>${i.any?fmt(i.q)+' ':''}${esc(i.u)} ${esc(i.n)}${!i.any&&i.c>1?' ×'+i.c:''}</span></label>`).join(''):'<div class="empty">Plan some recipes for the week and everything you need will show up here.</div>'}`}

function view(id){const r=S.recipes.find(x=>x.id===id);if(!r)return;
 sheet(`<div class="row"><button class="f" onclick="closeSheet()">← Back</button><span></span><button class="f" onclick="edit('${id}')">Edit</button></div>
 <h1>${esc(r.title)}</h1><div class="tag">${esc(r.category||'Uncategorized')}${r.link?` · <a href="${esc(r.link)}" target="_blank" rel="noopener">Source</a>`:''}</div>
 <h2>Ingredients</h2><ul>${(r.ingredients||'').split('\n').filter(x=>x.trim()).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
 <h2>Steps</h2><ol>${(r.steps||'').split('\n').filter(x=>x.trim()).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
 <button style="margin-top:20px;width:100%" onclick="del('${id}')">Delete recipe</button>`)}
function del(id){if(!confirm('Delete this recipe?'))return;S.recipes=S.recipes.filter(r=>r.id!==id);Object.keys(S.plan).forEach(d=>S.plan[d]=S.plan[d].filter(x=>x!==id));save();closeSheet()}
function sheet(h){const o=$('#ov');o.innerHTML=`<div class="sheet">${h}</div>`;o.hidden=false}
function closeSheet(){$('#ov').hidden=true;render()}
function edit(id){imgs=[];const r=S.recipes.find(x=>x.id===id)||{};
 sheet(`<div class="row"><button class="f" onclick="closeSheet()">Cancel</button><span></span><button class="p f" onclick="saveR('${id||''}')">Save</button></div>
 <h1>${id?'Edit':'New'} recipe</h1>
 ${id?'':`<div class="imp"><b>Import</b><div class="tag">Screenshot or pasted text. Pages can’t be fetched from inside this app, so for a link, paste the page text and keep the link as the source.</div>
 <div style="position:relative;text-align:center;padding:12px;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;margin:8px 0">Choose screenshot(s)<input type="file" id="f" accept="image/*" multiple onchange="setImgs(this.files);this.value=''" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;padding:0;cursor:pointer"></div><div id="fn" class="tag">You can also paste an image from your clipboard.</div><input id="lk" type="url" placeholder="Recipe link (optional)" style="margin-top:10px"><textarea id="t" placeholder="…or paste recipe text here" style="min-height:70px"></textarea>
 <button class="p" id="go" onclick="imp()" style="width:100%">Extract ingredients &amp; steps</button><div id="st" class="tag" style="margin-top:8px"></div></div>`}
 <label class="tag">Title</label><input id="e1" value="${esc(r.title)}">
 <label class="tag">Category</label><input id="e2" list="cl" value="${esc(r.category)}"><datalist id="cl">${CATS.map(c=>`<option>${c}</option>`).join('')}</datalist>
 <label class="tag">Source link (optional)</label><input id="e3" value="${esc(r.link)}">
 <label class="tag">Ingredients (one per line, e.g. “2 cups flour”)</label><textarea id="e4">${esc(r.ingredients)}</textarea>
 <label class="tag">Steps (one per line)</label><textarea id="e5">${esc(r.steps)}</textarea>`)}
function saveR(id){const v=n=>$('#e'+n).value.trim();if(!v(1))return toast('Add a title');
 const o={id:id||'r'+Date.now(),title:v(1),category:v(2),link:v(3),ingredients:v(4),steps:v(5)};
 const i=S.recipes.findIndex(r=>r.id===id);i>=0?S.recipes[i]=o:S.recipes.push(o);save();closeSheet();if(id)view(id)}
let imgs=[];
function setImgs(fl){imgs=[...imgs,...fl];const e=$('#fn');if(e)e.textContent=imgs.length+' image(s) ready. Tap Extract below.'}
document.addEventListener('paste',e=>{const fs=[...(e.clipboardData&&e.clipboardData.files||[])].filter(f=>f.type.startsWith('image/'));if(fs.length&&$('#fn')){setImgs(fs);e.preventDefault()}});
const st=t=>{const e=$('#st');if(e)e.textContent=t;toast(t)};
async function imp(){
 const files=imgs,text=$('#t').value.trim(),url=$('#lk').value.trim();if(!files.length&&!text&&!url)return st('Add a screenshot, a link, or some recipe text first.');
 const b=$('#go');b.disabled=true;b.textContent='Reading recipe…';
 try{const s=await claude.use('sample');if(!s)throw{message:'Import isn’t available in this view.'};
  const opts={};if(files.length){const l=await s.limits();if(!l.images)throw{message:'Screenshots aren’t supported here. Paste text instead.'};opts.images=files}
  const r=await s.json(`Extract the recipe from the attached screenshot(s), pasted text, and/or web link below. ${url?'Link: '+url+'. Use only content you actually retrieved from that page and never guess from the URL text. If you cannot open it and have no other source, reply {"error":"cannot_open"}. ':''}Reply with JSON only: {"title":string,"category":one of ${JSON.stringify(CATS)},"ingredients":[string lines like "2 cups flour" or "3 eggs"],"steps":[string]}. Keep quantities exact; no step numbers.\n\n${text}`,opts);
  if(r.error)throw{message:'I couldn’t open that link from here. Paste the recipe text instead, or send me the link in chat and I’ll pull it out for you.'};if(url)$('#e3').value=url;$('#e1').value=r.title||'';$('#e2').value=r.category||'';$('#e4').value=(r.ingredients||[]).join('\n');$('#e5').value=(r.steps||[]).join('\n');
  st('Done. Review the fields below and save.')}
 catch(e){st((e&&e.message)||'Couldn’t read that recipe. Try pasting the text instead.')}
 b.disabled=false;b.textContent='Extract ingredients & steps'}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
render();
</script></body></html>
